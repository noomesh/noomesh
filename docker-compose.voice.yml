# docker-compose.voice.yml — the voice add-on OVERLAY: noo-whisper (STT) and
# noo-piper (TTS). an earlier change.
#
# Composed by the launcher when `addons.voice: true` is declared in
# noomesh.yaml (scripts/lib-compose.sh, the one file list) and by nothing
# else. No `profiles:` in here, on purpose: composing this file IS the
# switch. Opting out on a live stack stops the containers in
# the same run — `up` never touches a service it was not shown.
#
# Dist installs: each service below interpolates `pull_policy:
# ${NOO_PULL_POLICY:-build}`, and both dist implementations export `missing`.
# The launcher does NOT pass --no-build on its `up`, which is what the
# earlier note here claimed; trellion relied on the same claim and a
# standalone controller tried to build it from a checkout it does not have
# (2026-09-23). A dist row for these services is deliberately absent: a row
# for a service the overlay did not compose is a bare service with no image,
# and compose refuses the whole project.
#
# Models are staged by the CONTROLLER, never fetched by these containers
# (i105). `noo models pull whisper:<size>` / `noo models pull piper:<voice>`
# (also run by `noo addons enable voice`, `noo upgrade --stack` and onboard
# while voice is on) download, verify and lay them out under the model store
# (MODELS_DIR, default <data root>/models) in voice/whisper and voice/piper.
# Each service mounts its half READ-ONLY and runs with HF_HUB_OFFLINE=1 /
# TRANSFORMERS_OFFLINE=1 and no HF token; a model or voice that is not
# staged is a 404 naming the `noo models pull` line (docker/voice_local.py).
# Nothing writes a model at run time, so there is no writable model volume.
#
# Non-root (i105): both images run as `nonroot` (uid/gid 65532, the image's
# USER; no `user:` here — a numeric one breaks Docker 27, see
# tests/test_compose_named_users.py). The read-only mounts need no re-own.
#
# Whisper STT — faster-whisper behind the OpenAI-compatible audio API
# (docker/whisper_server.py). The gateway's generic STT provider layer
# (gateway-rust/src/stt_client.rs) points at it by default
# (https://noo-whisper:8000, wire format "openai"), so enabling the add-on is
# the whole setup. CPU (int8) by default; WHISPER_MODEL picks the preloaded
# model (tiny/base/small/medium/large-v3 or an HF CTranslate2 repo id). The
# long-term GPU home is a node-agent backend spec (backends.go), like
# embedding/reranker — not a GPU variant of this service.
#
# Piper TTS — piper-tts behind the OpenAI-compatible speech API
# (docker/piper_server.py). The gateway's generic TTS provider layer
# (gateway-rust/src/tts_client.rs) points at it by default
# (https://noo-piper:8000, wire format "openai"); its native /synthesize shape
# is wire format "piper".
#
# mTLS doors phase 2 (i77): both doors serve TLS from uvicorn itself and
# REQUIRE a cluster-CA client certificate (--ssl-cert-reqs 2 =
# ssl.CERT_REQUIRED), the listener shape the sandbox and vLLM run — no
# stunnel sidecar, no plaintext port. Each mounts only the CA and its OWN
# leaf (services/whisper, services/piper; issued by onboard and by
# `noo upgrade --stack`), read-only. The gateway dials them with its own
# leaf and refuses an http:// URL; `noo cluster verify --controller` →
# `voice listeners` probes both live from inside the gateway.
#
# To use a DIFFERENT provider instead (OpenAI cloud, vLLM audio model,
# speaches, LocalAI, kokoro-fastapi, openedai-speech):
#   NOO_STT_URL / NOO_TTS_URL              (e.g. https://api.openai.com; https
#                                           only — an https host that is not
#                                           the cluster's is dialled with the
#                                           public roots and no client cert)
#   NOO_STT_BACKEND / NOO_TTS_BACKEND      (openai; "whisper"/"piper" for the native shapes)
#   NOO_STT_MODEL                          (e.g. whisper-1; empty = client hint)
#   NOO_STT_API_KEY_ENV / NOO_TTS_API_KEY_ENV (e.g. OPENAI_API_KEY)
# Provider selection is the gateway's; this overlay only deploys the
# containers.
#
# YAML anchors do not cross files: the logging block is restated here, the
# same way docker-compose.evolve.yml carries it.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  whisper:
    logging: *default-logging
    build:
      context: .
      dockerfile: docker/Dockerfile.whisper
    # Same reason as trellion's: an add-on overlay
    # cannot have a dist row, so the pull policy is interpolated and the
    # launcher exports `missing` in dist mode. Without it the fallback is
    # `build`, and a standalone controller that has already PULLED this
    # image rebuilds it from a deploy slice that carries no docker/ tree.
    pull_policy: ${NOO_PULL_POLICY:-build}
    image: ${NOO_IMAGE_PREFIX:-noomesh}/whisper:${NOO_IMAGE_TAG:-latest}${NOO_IMAGE_DIGEST_WHISPER:-}
    container_name: ${NOO_CONTAINER_PREFIX:-noo}-whisper
    # The image's CMD with the mTLS listener added: uvicorn terminates TLS
    # with whisper's own leaf and refuses a caller with no cluster-CA client
    # certificate in the handshake, before any route runs.
    command:
      - uvicorn
      - whisper_server:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --ssl-certfile
      - /tls/services/whisper/service.crt
      - --ssl-keyfile
      - /tls/services/whisper/service.key
      - --ssl-ca-certs
      - /tls/ca.crt
      - --ssl-cert-reqs
      - "2"
    # No published port — reachable only on noo-cluster, over mTLS.
    expose:
      - "8000"
    environment:
      # Vendor telemetry off (docs/security/telemetry.md): huggingface_hub and
      # the libraries built on it honour these.
      - HF_HUB_DISABLE_TELEMETRY=1
      - DO_NOT_TRACK=1
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-auto}
      - WHISPER_MODEL_DIR=/models
      # Offline: the controller staged the model; nothing here may fetch.
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    volumes:
      # The staged whisper models, read-only (noo models pull whisper:<size>).
      - ${MODELS_DIR:-${NOO_DATA_ROOT:?NOO_DATA_ROOT is not set - run noo onboard --only storage or set it in .env}/models}/voice/whisper:/models:ro
      # The CA and whisper's OWN leaf, read-only.
      - ${NOO_PKI_DIR:-./.pki-placeholder}/ca.crt:/tls/ca.crt:ro
      - ${NOO_PKI_DIR:-./.pki-placeholder}/services/whisper:/tls/services/whisper:ro
    # Over the door itself (replaces the image's plaintext probe): the CA
    # verifies the server (`localhost` is in the leaf) and the container's
    # own leaf is the client certificate the listener requires.
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,sys,urllib.request; c=ssl.create_default_context(cafile='/tls/ca.crt'); c.load_cert_chain('/tls/services/whisper/service.crt','/tls/services/whisper/service.key'); sys.exit(0 if urllib.request.urlopen('https://localhost:8000/health',context=c,timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    networks:
      - noo-cluster
    restart: unless-stopped

  piper:
    logging: *default-logging
    build:
      context: .
      dockerfile: docker/Dockerfile.piper
    # Same reason as trellion's: an add-on overlay
    # cannot have a dist row, so the pull policy is interpolated and the
    # launcher exports `missing` in dist mode. Without it the fallback is
    # `build`, and a standalone controller that has already PULLED this
    # image rebuilds it from a deploy slice that carries no docker/ tree.
    pull_policy: ${NOO_PULL_POLICY:-build}
    image: ${NOO_IMAGE_PREFIX:-noomesh}/piper:${NOO_IMAGE_TAG:-latest}${NOO_IMAGE_DIGEST_PIPER:-}
    container_name: ${NOO_CONTAINER_PREFIX:-noo}-piper
    # The same mTLS listener over piper's own leaf.
    command:
      - uvicorn
      - piper_server:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --ssl-certfile
      - /tls/services/piper/service.crt
      - --ssl-keyfile
      - /tls/services/piper/service.key
      - --ssl-ca-certs
      - /tls/ca.crt
      - --ssl-cert-reqs
      - "2"
    # No published port — reachable only on noo-cluster, over mTLS.
    expose:
      - "8000"
    environment:
      # Vendor telemetry off (docs/security/telemetry.md): huggingface_hub and
      # the libraries built on it honour these.
      - HF_HUB_DISABLE_TELEMETRY=1
      - DO_NOT_TRACK=1
      - PIPER_VOICE=${PIPER_VOICE:-en_US-lessac-medium}
      - PIPER_USE_CUDA=${PIPER_USE_CUDA:-0}
      - PIPER_VOICE_DIR=/voices
      # Offline: the controller staged the voice; nothing here may fetch.
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    volumes:
      # The staged piper voices, read-only (noo models pull piper:<voice>).
      - ${MODELS_DIR:-${NOO_DATA_ROOT:?NOO_DATA_ROOT is not set - run noo onboard --only storage or set it in .env}/models}/voice/piper:/voices:ro
      # The CA and piper's OWN leaf, read-only.
      - ${NOO_PKI_DIR:-./.pki-placeholder}/ca.crt:/tls/ca.crt:ro
      - ${NOO_PKI_DIR:-./.pki-placeholder}/services/piper:/tls/services/piper:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,sys,urllib.request; c=ssl.create_default_context(cafile='/tls/ca.crt'); c.load_cert_chain('/tls/services/piper/service.crt','/tls/services/piper/service.key'); sys.exit(0 if urllib.request.urlopen('https://localhost:8000/health',context=c,timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    networks:
      - noo-cluster
    restart: unless-stopped

