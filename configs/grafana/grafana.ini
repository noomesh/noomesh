# PersonifAI Grafana Configuration
# Mounted at /etc/grafana/grafana.ini

# People log in through noomesh: the console's "Open
# Grafana" asks the gateway for a short ES256 token for the LIVE noomesh
# account and opens Grafana with it. Grafana verifies it against the public
# half of a dedicated key pair and creates no session of its own — the token
# IS the session, 15 minutes by default (NOO_GRAFANA_SESSION_TTL, 60 max).
# tests/test_grafana_sso_parity.py holds this file to the gateway's
# constants (issuer, audience, role names) and to the compose mount.

[auth]
# A noomesh account is the only way in. `disable_login`
# turns off Grafana's own username/password check everywhere — the form,
# `POST /login` and basic auth alike — which `disable_login_form` alone
# does not: until 2026-09-30 the form was hidden but `curl -u
# admin:<password>` still logged in as the Grafana server admin (measured
# on the 12.4 image). There is no local break-glass login: a noomesh admin
# opens Grafana as an org Admin, and `grafana cli admin` inside the
# container still works for the server-admin account. The admin password
# (GRAFANA_PASSWORD, sops, delivered as a file) seeds that account so it
# is never admin/admin; it logs in nowhere. `noo cluster verify
# --controller` FAILs its "grafana door" row if any of this reopens.
disable_login = true
disable_login_form = true
disable_signout_menu = true
# A bookmark of Grafana's port (or a session that expired) lands on
# Grafana's `/login`, which with no login form is a bare welcome page. On
# the tailnet door `tailscale serve` maps `/login` to Grafana's `/logout`,
# and `/logout` answers 302 here for anyone (measured on 12.4.11): the
# console's Observe panel, which opens Grafana for the visitor after the
# console's own login (noo-cli/src/tailnet_serve.rs). Compose passes
# NOO_GRAFANA_CONSOLE_URL; `noo upgrade --stack` derives it. Empty (the
# loopback door) = Grafana's default, back to `/login`.
signout_redirect_url = $__env{NOO_GRAFANA_CONSOLE_URL}

[auth.basic]
enabled = false

[users]
# Default theme for all users
default_theme = dark
# Nobody registers here; accounts are noomesh accounts, auto-created on
# first token (auto_sign_up below) in the default org at the mapped role.
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Viewer
# A read-only noomesh account is a Viewer. In open-source
# Grafana ANY user, Viewer included, can POST /api/ds/query with its own
# PromQL/LogQL and nothing here closes that; what closes it is the data
# sources (datasources/*.yml), which dial the gateway, and the gateway runs
# a read-only account's query only when it is one of the provisioned
# dashboards' own, and gives it no logs. The knobs below keep the Viewer to
# dashboards in Grafana's own UI: no editing in the browser, no Explore
# (Grafana grants `datasources:explore` to Editors and up only; a Viewer's
# /explore redirects home — measured on 12.4), no data-source or admin
# pages it can change. Spelled out, not left to Grafana's defaults, and
# pinned by tests/test_grafana_sso_parity.py.
viewers_can_edit = false
editors_can_admin = false

[explore]
# On, for Editors and Admins (operators, admins). A Viewer would be kept
# out by role, not by turning Explore off for everyone.
enabled = true

[auth.jwt]
enabled = true
# The console opens Grafana with ?auth_token=<jwt> (url_login); Grafana's
# own front end then sends it as this header on every API call. The header
# name MUST be set or the SPA's calls go out unauthenticated.
header_name = X-JWT-Assertion
url_login = true
username_claim = sub
auto_sign_up = true
# The PUBLIC half of ${NOO_PKI_DIR}/sso/grafana.pub — the one sso/ file the
# compose file mounts. No key_id: the gateway sends no kid, and Grafana's
# one-key set from key_file matches a token only when both are absent.
key_file = /app/pki/sso/grafana.pub
expect_claims = {"iss": "noo-gateway", "aud": "noo-grafana"}
# NOT a mapping: the gateway decides the org role from ONE table,
# `auth::GRAFANA_ORG_ROLES` in gateway-rust/src/auth.rs (the place to
# tighten who opens Grafana and as what), and stamps it into the token as
# `grafana_role`. This passes exactly the three org roles through; strict,
# so a token without one is refused rather than admitted as Viewer. (The
# gateway stamps Viewer for a read-only account since an earlier change.)
role_attribute_path = grafana_role == 'Admin' && 'Admin' || grafana_role == 'Editor' && 'Editor' || grafana_role == 'Viewer' && 'Viewer'
role_attribute_strict = true
# A noomesh admin is a Grafana org Admin, never a Grafana SERVER admin:
# that stays with the break-glass account.
allow_assign_grafana_admin = false
# Re-sync the org role on every request, so a demotion in noomesh takes
# effect at the next token, not at the next Grafana login (there is none).
skip_org_role_sync = false

[dataproxy]
# Tell the data source who is looking. Grafana sets
# X-Grafana-User to the signed-in login on every request to a data source
# — /api/ds/query, expressions, /resources/, the legacy proxy — and
# REPLACES a value the browser sent (measured on 12.4.11, JWT logins
# included). The gateway believes it only from Grafana's service leaf and
# enforces that person's live noomesh tier per query.
send_user_header = true

[public_dashboards]
# Off: a shared ("public") dashboard queries with no user at all. The
# gateway would hold it to the read-only policy, but nothing in noomesh
# shares dashboards outside its accounts. Grafana 12 turns this ON by
# default (measured: publicDashboardsEnabled true until set here).
enabled = false

[unified_alerting]
# Grafana-managed alert rules evaluate with NO user (X-Rule-* headers
# only, measured on 12.4.11), so the gateway holds them to the read-only
# policy: a rule whose query is not one of the provisioned dashboards'
# errors. Alerting proper is Prometheus rules + Alertmanager.
enabled = true

[auth.anonymous]
enabled = false

# ── No phone-home (PR #692) ──────────────────────────────────
# Grafana calls grafana.com (and stats.grafana.org, storage.googleapis.com)
# by default: usage reporting, version and plugin-update checks (the "New
# version available!" on the login page), plugin signing keys, the news
# feed, gravatar, external snapshots, preinstalled plugins. A noomesh
# controller makes none of those calls; every switch below is spelled out,
# pinned by tests/test_grafana_sso_parity.py, and `noo cluster verify
# --controller` FAILs its "grafana door" row if one is back on
# (grafana_door::phone_home_findings). Measured on 12.4.11 with a DNS/SYN
# capture: the shipped defaults reached grafana.com and
# storage.googleapis.com within a minute of start; this file reaches
# nothing.
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[snapshots]
# Local snapshots stay; publishing to snapshots.raintank.io does not.
external_enabled = false

[security]
disable_gravatar = true

[plugins]
# Plugins come with the image; nothing installs, updates or verifies
# against grafana.com at run time.
plugin_admin_enabled = false
public_key_retrieval_disabled = true
preinstall_disabled = true
preinstall_auto_update = false

[cloud_migration]
enabled = false

[grafana_com]
# The backstop for the calls no switch above turns off — the remote plugin
# catalog that Administration → Plugins lists through Grafana's /api/gnet
# proxy, and the angular-detection pattern refresh — measured going to
# grafana.com on 12.4.11 with every switch above off. Pointed at a closed
# port on Grafana's own loopback, they fail on the spot and leave nothing.
api_url = http://127.0.0.1:9/api

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/cluster-overview.json
