# Dependency update PRs. Every entry targets `dev`: `dev` is the integration
# branch and the only one that takes pull requests; staging and main change
# by promotion only (tests/test_ci_public_safety.py holds every entry to it).
# Minor and patch bumps are grouped per manifest so one PR carries them;
# majors arrive one per PR. The two Rust crates are separate manifests (no
# Cargo workspace), so each has its own entry. Security updates follow the
# same target branch.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/ui"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      npm-ui-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: pip
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      pip-minor-patch:
        update-types:
          - minor
          - patch
  # The hash-locked install set the shipped image uses
  # (docker/core-lock/requirements.txt, installed with --require-hashes). Dependabot
  # bumps the pins here; regenerate the hashes with the command in the file's
  # header before merging a bump (a pin without matching hashes fails the image
  # build, which is the point).
  - package-ecosystem: pip
    directory: "/docker/core-lock"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      pip-lock-minor-patch:
        update-types:
          - minor
          - patch
  # The ML tier's lock (docker/ml-lock/requirements.txt, Dockerfile.deps-base).
  # Same rule as core-lock, and a stricter consequence: it holds deps-core's
  # pins at the same versions (tests/test_python_lock_guard.py), so a bump that
  # lands in one lock alone fails CI. Regenerate both with
  # scripts/regen-ml-lock.sh and the command in core-lock's header.
  - package-ecosystem: pip
    directory: "/docker/ml-lock"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      pip-ml-lock-minor-patch:
        update-types:
          - minor
          - patch
    # thinc is pinned by spaCy (spacy 3.8.x requires thinc>=8.3.12,<8.4.0), so a
    # thinc major cannot resolve until spaCy declares support for it (checked
    # against spacy 3.8.16, the latest at the time). Drop this when it does.
    ignore:
      - dependency-name: thinc
        update-types:
          - version-update:semver-major
  - package-ecosystem: pip
    directory: "/packages/noo-gateway-client"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      pip-packages-noo-gateway-client-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: gomod
    directory: "/node-agent-go"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      gomod-node-agent-go-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: cargo
    directory: "/gateway-rust"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      cargo-gateway-rust-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: cargo
    directory: "/noo-cli"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      cargo-noo-cli-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch
