#
# Daily build of the infra images, OUTSIDE the release (noomesh-internal i567).
#
# llamacpp (llama-server compiled from source, arm64 under QEMU: ~60 min),
# llamacpp-cuda (the same, CUDA 12.9, amd64 only), ollama, stunnel, postgres-pgvector, whisper, piper and nvidia-exporter carry
# no noomesh source and change a few times a quarter, yet every new version's
# rc.1 rebuilt them. Here they are built once a day from dev, on the day's
# refreshed base images (TODAY'S BASES below: a rebuild alone takes no distro
# fix, every FROM is pinned by digest), then:
#
#   1. pushed ONLY to an immutable `:staged-YYYYMMDD-<run>` tag, labelled with
#      the content fingerprint (scripts/infra-staged.py) and the build time;
#   2. scanned with Trivy (the version ci.yml's security-scan pins), fixable
#      HIGH/CRITICAL, every platform; the current `:staged` is scanned with the
#      SAME database in the same run (scripts/infra-scan.sh, which the
#      release's fallback build runs too);
#   3. promoted to `:staged` only when the new build has no fixable
#      HIGH/CRITICAL finding that the current :staged lacks. Gating on "new",
#      not on zero: the Dockerfiles do not `apt-get upgrade` (one exception:
#      llamacpp-cuda's runtime stage takes noble-security, its Dockerfile says
#      why), so a fixable finding in a digest-pinned base layer stays until
#      refresh-image-digests.yml moves the pin; a zero gate would freeze
#      :staged for good.
#
# A failed build or scan, or a new finding, leaves the previous :staged where
# it is and turns the run red. The release refuses a :staged older than 3 days
# and builds the image itself (loudly), then scans that build with this same
# script and gate against the current :staged, before its digest reaches the
# signed lock (images-release.yml "Scan … as infra-staged does"); so a broken
# daily job costs release minutes, never a stale or unscanned image.
#
# The build arguments come from the images-release.yml matrix
# (`infra-staged.py matrix`), so the staged image is built exactly as the
# release would build it; the buildx command below must stay the release's
# (tests/test_infra_staged.py compares them).
#
# Like every scheduled workflow, the schedule runs from the DEFAULT branch, so
# it starts once this file reaches main; until then run it by hand:
#   gh workflow run infra-staged.yml -R noomesh/noomesh --ref dev
name: infra images staged daily
on:
  schedule:
    - cron: '17 3 * * *'   # daily, 03:17 UTC
  workflow_dispatch:
    inputs:
      promote:
        # false: build, push the date tag and scan, but leave :staged alone (a
        # dry run of the build). A run built from any ref but dev never
        # promotes, whatever this says (see "Promote to :staged").
        description: 'Move :staged to this build if its scan passes (only ever from dev)'
        type: boolean
        default: true
permissions:
  contents: read
  packages: write   # push $REGISTRY/$OWNER/<image>:staged*
concurrency:
  group: infra-staged   # one run moves :staged at a time
  cancel-in-progress: false
env:
  REGISTRY: ghcr.io
  OWNER: noomesh
  # What this run builds: a dispatch builds the ref it was dispatched on, the
  # schedule (which runs on the default branch, main) builds dev. Only a run
  # that built dev may move :staged: a release may ship :staged, and only
  # merged, queue-tested commits feed it.
  STAGE_REF: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'refs/heads/dev' }}
jobs:
  matrix:
    if: github.repository == 'noomesh/noomesh'
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.m.outputs.include }}
    steps:
      - name: Checkout dev   # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.STAGE_REF }}
      - name: The daily set, with the release's build arguments
        id: m
        run: |
          set -eu
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --user pyyaml
          echo "include=$(python3 scripts/infra-staged.py matrix)" >> "$GITHUB_OUTPUT"

  stage:
    name: ${{ matrix.image }} (build, scan, stage)
    needs: [matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - name: Checkout dev   # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.STAGE_REF }}
          # Full history (blobs on demand) for scripts/build-epoch.py.
          fetch-depth: 0
          filter: blob:none

      - name: Free disk (preinstalled toolchains the build does not use)
        run: scripts/ci-free-disk.sh
      - name: Pre-pull the BuildKit image (transient registry errors retried)
        run: scripts/retry-registry.sh docker pull moby/buildkit:buildx-stable-1 || echo "::warning::could not pre-pull moby/buildkit:buildx-stable-1; setup-buildx pulls it itself"
      - name: Set up buildx   # docker/setup-buildx-action@v4.4.1
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Set up buildx, second attempt   # docker/setup-buildx-action@v4.4.1
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Set up QEMU (arm64)   # docker/setup-qemu-action@v4.4.0
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: arm64

      - name: Registry logins (GHCR + dhi.io + docker.io)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: |
          set -eu
          echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          echo "$DHI_TOKEN" | docker login dhi.io -u "$DHI_USERNAME" --password-stdin
          echo "$DHI_TOKEN" | docker login docker.io -u "$DHI_USERNAME" --password-stdin \
            || echo "::warning::docker.io login failed — a Hub fallback pulls anonymously"

      # TODAY'S BASES (i604). Every FROM is pinned by digest in git, so a
      # rebuild alone never takes a distro fix. Each pinned FROM tag is
      # resolved at its SOURCE registry (dhi.io, docker.io; our mirrors follow
      # later) to the digest it points at now, refusing one built before the
      # git pin or before the base the current :staged was built on. The
      # checkout's Dockerfile is rewritten onto those digests, the fingerprint
      # covers them, and the org.noomesh.base-digests label records them, so
      # the release can recompute the same fingerprint from git + the label
      # and re-tag this exact digest (release-retag-plan.py apply_staged).
      - name: Resolve today's base digests, fingerprint and tags
        run: |
          set -eu
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --user pyyaml
          REF="$REGISTRY/$OWNER/${{ matrix.image }}"
          echo "REF=$REF" >> "$GITHUB_ENV"
          old="$(docker buildx imagetools inspect "$REF:staged" --format '{{json .Image}}' 2>/dev/null \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); c=[d] if "config" in d else list(d.values()); print(next(iter({(x.get("config") or {}).get("Labels",{}).get("org.noomesh.base-digests","") for x in c})))' 2>/dev/null || true)"
          bases="$(python3 scripts/infra-staged.py resolve-bases "${{ matrix.image }}" --staged-label "$old")" || {
            echo "::error::${{ matrix.image }}: could not resolve its base tags (see above); not staging it — the release builds it"; exit 1; }
          python3 scripts/infra-staged.py rebase-dockerfile "${{ matrix.image }}" --bases "$bases"
          git --no-pager diff -- "${{ matrix.dockerfile }}"
          fp="$(python3 scripts/infra-staged.py fingerprint "${{ matrix.image }}" --bases "$bases")" || {
            echo "::error::${{ matrix.image }} has no content fingerprint (see above); not staging it — the release builds it"; exit 1; }
          echo "BASES=$bases" >> "$GITHUB_ENV"
          echo "FP=$fp" >> "$GITHUB_ENV"
          echo "CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "DATE_TAG=staged-$(date -u +%Y%m%d)-${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "${{ matrix.image }} bases $bases"
          echo "${{ matrix.image }} fingerprint $fp"

      # The release's buildx command (images-release.yml "Build + push"), with
      # the two labels added and ONLY the immutable date tag pushed. No layer
      # cache: a daily build exists to take today's packages.
      - name: Build + push ${{ matrix.image }}:${{ env.DATE_TAG }}
        run: |
          set -eux
          # Reproducible layers (2026-11-11): every file time in a layer is
          # clamped to the newest commit touching this image's inputs, so an
          # unchanged layer keeps its digest and nodes do not download it again.
          # Assigned, then exported: `export X="$(…)"` would hide a refusal.
          SOURCE_DATE_EPOCH="$(python3 scripts/build-epoch.py "${{ matrix.image }}")"
          export SOURCE_DATE_EPOCH
          scripts/retry-registry.sh docker buildx build \
            --output type=registry,rewrite-timestamp=true \
            --platform "${{ matrix.platforms }}" \
            -f "${{ matrix.dockerfile }}" \
            --build-arg DHI_REGISTRY=dhi.io \
            --build-arg HUB_MIRROR=docker.io \
            --label "org.noomesh.build-fingerprint=$FP" \
            --label "org.noomesh.base-digests=$BASES" \
            --label "org.opencontainers.image.created=$CREATED" \
            -t "$REF:$DATE_TAG" \
            ${{ matrix.extra_args }} \
            "${{ matrix.context }}"
          d="$(docker buildx imagetools inspect "$REF:$DATE_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [ -n "$d" ] || { echo "::error::$REF:$DATE_TAG does not resolve after the push"; exit 1; }
          echo "DIGEST=$d" >> "$GITHUB_ENV"

      # Same pinned, checksum-verified install as ci.yml's security-scan; the
      # pin lives in scripts/infra-scan.sh alone.
      - name: Install Trivy (pinned, checksum-verified)
        run: scripts/infra-scan.sh install-trivy

      # Every platform of the new build, and of the current :staged, against
      # ONE vulnerability database (downloaded once, then --skip-db-update).
      - name: Scan the new build and the current :staged
        run: scripts/infra-scan.sh scan "$REF" "$DIGEST" "${{ matrix.platforms }}"

      - name: Gate — no fixable HIGH/CRITICAL the current :staged lacks
        run: scripts/infra-scan.sh gate

      - name: Promote to :staged
        env:
          PROMOTE: ${{ inputs.promote }}
        run: |
          set -eu
          if [ "$STAGE_REF" != "refs/heads/dev" ]; then
            echo "::notice::built from $STAGE_REF, not dev: :staged stays (only merged commits feed it)"; exit 0
          fi
          if [ "${PROMOTE:-true}" != "true" ]; then
            echo "::notice::promote=false: built, pushed $DATE_TAG and scanned; :staged stays"; exit 0
          fi
          scripts/retry-registry.sh docker buildx imagetools create --tag "$REF:staged" "$REF@$DIGEST"
          now="$(docker buildx imagetools inspect "$REF:staged" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [ "$now" != "$DIGEST" ]; then
            echo "::error::$REF:staged is $now after promoting $DIGEST"; exit 1
          fi
          echo "| ${{ matrix.image }} | \`$DATE_TAG\` | \`$DIGEST\` | \`$FP\` | replaces \`${OLD_DIGEST:-none}\` |" >> "$GITHUB_STEP_SUMMARY"

  # i1042: four red nights (2026-11-15..18) went unnoticed: GitHub mails a
  # scheduled run's failure only to whoever last edited the cron line. The
  # SECOND consecutive failed run opens one `infra-staged-red` issue (later
  # ones comment on it); a green run closes it. Never on a pull_request or any
  # event a fork can trigger, and the issue write is granted to this job only.
  # The repository is public: the script puts only image names, CVE/GHSA ids,
  # package names, :staged ages and the run URL in the issue.
  red-issue:
    name: second red run opens an issue, a green run closes it
    needs: [matrix, stage]
    if: always() && github.repository == 'noomesh/noomesh' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read   # the checkout
      actions: read    # this run's jobs and logs, the previous scheduled runs
      issues: write    # the infra-staged-red label and issue
    steps:
      - name: Checkout   # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Open, update or close the infra-staged-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/infra-staged-red.py
