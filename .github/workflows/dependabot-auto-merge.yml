# Dependabot minor/patch auto-merge.
#
# For a Dependabot pull request whose highest semver change is a minor or a
# patch, ask GitHub to merge it once the required checks pass (`gh pr merge
# --auto`; with the merge queue on `dev` that enqueues it). Nothing here
# approves, bypasses or weakens a check: if CI is red, nothing merges.
#
# NEVER auto-merged:
#   * majors, and anything fetch-metadata cannot classify (update-type empty);
#   * the github-actions ecosystem, even for a minor: those bumps touch the
#     workflows that sign and publish releases, so a person reads them;
#   * /docker/core-lock: its pins are hash-locked and a bump needs its hashes
#     regenerated by hand before it can merge (see dependabot.yml).
# Grouped updates: `update-type` is the HIGHEST change in the PR, so a group
# is auto-merged only when every member is a minor or a patch (the configured
# groups hold only minor/patch updates; a major arrives as its own PR).
#
# Trigger is `pull_request`, never `pull_request_target`: the job runs the
# PR's own (Dependabot-authored) workflow definition with a token limited to
# what `permissions:` grants, and no job here checks out or runs PR code.
name: Dependabot auto-merge

on:
  pull_request:
    branches: [ dev ]

permissions:
  contents: read

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]' && github.repository == 'noomesh/noomesh'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Dependabot metadata
      id: meta
      uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98   # v3.1.0
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Enable auto-merge for minor and patch updates
      if: >-
        (steps.meta.outputs.update-type == 'version-update:semver-minor'
        || steps.meta.outputs.update-type == 'version-update:semver-patch')
        && steps.meta.outputs.package-ecosystem != 'github_actions'
        && !startsWith(github.head_ref, 'dependabot/github_actions/')
        && steps.meta.outputs.directory != '/docker/core-lock'
      env:
        PR_URL: ${{ github.event.pull_request.html_url }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh pr merge --auto --rebase "$PR_URL"

    - name: Left for a person
      if: >-
        !((steps.meta.outputs.update-type == 'version-update:semver-minor'
        || steps.meta.outputs.update-type == 'version-update:semver-patch')
        && steps.meta.outputs.package-ecosystem != 'github_actions'
        && !startsWith(github.head_ref, 'dependabot/github_actions/')
        && steps.meta.outputs.directory != '/docker/core-lock')
      run: |
        echo "::notice::not auto-merged: update-type='${{ steps.meta.outputs.update-type }}' ecosystem='${{ steps.meta.outputs.package-ecosystem }}' directory='${{ steps.meta.outputs.directory }}'"
