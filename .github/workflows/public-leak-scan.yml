# Public-repo leak scan: generic patterns only (secret shapes, private keys,
# tailnet / LAN addresses, tailnet hostnames, real home paths, key/env files).
# No secrets, no private repository access. Copy this file and
# scripts/public-leak-scan.sh unchanged into another public repository, or call
# it from there:
#
#   jobs:
#     leak-scan:
#       uses: noomesh/noomesh/.github/workflows/public-leak-scan.yml@<full SHA>
name: public-leak-scan

# It is a TEMPLATE: noomesh itself is a networking product whose tests name LAN
# addresses and home paths on purpose, so here it runs only on demand
# (workflow_dispatch) and when called. A repo that wants it on every PR adds
# `pull_request:` to its own copy.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan the tree
        run: bash scripts/public-leak-scan.sh .
