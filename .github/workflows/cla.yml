# CLA gate: asks outside contributors to sign CLA.md before a pull request is
# merged; signatures are stored on the `cla-signatures` branch of this repository.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: github.repository == 'noomesh/noomesh'
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_PAT }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/${{ github.repository }}/blob/cla-v1.0/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'personifai-llc,richard-raithel,dependabot[bot],github-actions[bot]' # leak-ok: public GitHub handles of the founders (verified org members); the CLA allowlist must name them
          custom-notsigned-prcomment: 'Thanks for the contribution! Before we can merge it, we need you to sign the Contributor License Agreement — it lets PersonifAI keep offering Noomesh under both the AGPL and a commercial licence. Please read it at the link above and reply to this comment with the sentence below.'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you.'
          lock-pullrequest-aftermerge: false
