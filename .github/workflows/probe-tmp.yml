name: probe-tmp
on:
  pull_request:
    branches: [ dev ]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          set -x
          sudo apt-get update -qq && sudo apt-get install -y -qq "linux-headers-$(uname -r)" swtpm swtpm-tools build-essential
          d=$(mktemp -d); cd $d
          base=https://raw.githubusercontent.com/torvalds/linux/v6.17/drivers/char/tpm
          curl -fsSLO $base/tpm_vtpm_proxy.c; curl -fsSLO $base/tpm.h
          grep -n '#include' tpm.h tpm_vtpm_proxy.c
          printf 'obj-m += tpm_vtpm_proxy.o\n' > Makefile
          make -C /lib/modules/$(uname -r)/build M=$PWD modules 2>&1 | tail -30
          ls -l *.ko
          sudo insmod tpm_vtpm_proxy.ko; dmesg | tail -5; ls -l /dev/vtpmx
          uname -a; cat /sys/kernel/security/lockdown 2>&1
