name: probe-tmp
on:
  pull_request:
    branches: [ dev ]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          uname -r; grep -i -E 'TPM|CUSE|FUSE=|MODULES=|MODVERSIONS|MODULE_SIG|VIRTIO' /boot/config-$(uname -r) | head -60
          ls /dev/kvm /dev/cuse /dev/fuse /dev/tpm* 2>&1
          ls /lib/modules/$(uname -r)/kernel/drivers/char/tpm 2>&1; find /lib/modules/$(uname -r) -name 'cuse*' -o -name 'tpm*' | head
          sudo modprobe cuse 2>&1; lsmod | head -30
          ls /sys/class | head -50; dpkg -l | grep -E 'linux-(azure|image|headers)' | head
          cat /sys/kernel/security/tpm0/ascii_bios_measurements 2>&1 | head -2
          apt-cache policy linux-modules-extra-azure | head -4
