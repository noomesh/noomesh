# Mirror third-party images into our GHCR.
#
# Why: ci.yml's sqlx-drift job needs a Postgres SERVICE container. Service
# images are pulled during job SETUP — before any step runs — so a Docker
# Hub outage doesn't fail the job, it hangs it: 2026-08-06 produced three
# consecutive 15m01s runs with ZERO steps executed. Pulling from our own
# GHCR removes the Hub dependency; this workflow refreshes the mirror.
#
# Pushing from a workflow (GITHUB_TOKEN) also auto-links the package to
# THIS repo, which is what lets ci.yml's `credentials:` block read it with
# the ordinary GITHUB_TOKEN — no PAT involved.
#
# Run it by hand: `gh workflow run mirror-images.yml -R noomesh/noomesh`.
# workflow_dispatch runs the file as it is on the DEFAULT branch (main), so a
# matrix change reaches the mirror once it is promoted there. There is no
# push or schedule trigger: this workflow holds registry credentials and
# pushes packages, so it starts only on a deliberate dispatch. Mirrored tags
# are stable majors; refreshes are rare and deliberate.
name: mirror images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    # Skipped outside the canonical repo: a fork has neither the DHI token nor
    # the right to push to ghcr.io/noomesh.
    if: github.repository == 'noomesh/noomesh'
    # Cloud runner on purpose: mirroring is pull-from-Hub + push-to-GHCR,
    # pure network I/O with no cache to reuse.
    runs-on: ubuntu-latest
    strategy:
      # One dead upstream source must not cancel the others. A mirror
      # that stops at the first 404 leaves every base image it had already
      # reached un-mirrored, which is how `dhi.io/promtail:3: not found` —
      # an image DHI no longer publishes, unrelated to anything here —
      # cancelled the uv/python/rust/alpine-base lane the stack release
      # depends on. Partial is the right answer for a mirror: copy what
      # exists, and let the run name what did not.
      fail-fast: false
      # ghcr.io rate-limits pushes per minute (HTTP 429, "allowed: 2000/minute");
      # sixteen jobs pushing at once tripped it on the first dispatch. Three at
      # a time stays under it, and the copy step below retries a stray 429.
      max-parallel: 3
      matrix:
        include:
          # ci.yml sqlx-drift service container. Keep the tag in lockstep
          # with docker/Dockerfile.postgres's major (pg_dump output differs
          # across majors and the drift check would fail on version, not
          # drift).
          - source: pgvector/pgvector:pg18@sha256:c29f30688a9ad961691bdf0ec1650717cc132a5814619d80f80463d6e4c42e47
            dest: pgvector:pg18

          # ── Docker Hub base images (build path) ──────────────────────
          # python:3.12-slim is the root Dockerfile's base and ci.yml's
          # `build` job died on it 2026-08-17: "timeout awaiting response
          # headers" from registry-1.docker.io. ci.yml already logs in to
          # Hub for the higher RATE LIMIT, which does nothing for a network
          # timeout — the pull has to leave Hub entirely.
          #
          # There was a python:3.11-slim row here too, mirrored because the
          # root Dockerfile was still on 3.11 while every shipped image ran
          # 3.12. That Dockerfile now reads `.python-version` like everything
          # else, so 3.11 has no consumer — see
          # tests/test_python_version_single_source.py.
          - source: python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159
            dest: python:3.12-slim
            auth: hub

          # ── dhi.io (runtime services) ────────────────────────────────
          # Three TLS-handshake timeouts against dhi.io on 2026-08-17
          # alone. Mirroring also removes an AUTH failure mode: pulling
          # these needs DHI_TOKEN at build time, so a credential problem
          # is currently indistinguishable from an outage.

          - source: dhi.io/redis:8.6-debian13-dev@sha256:d9903f6fbf1e690837d1e1edc6716a7b399385b3b2cbf3301af06fb8a6168034
            dest: redis:8.6-debian13-dev
            auth: dhi
            dest_org: noomesh/dhi
          - source: dhi.io/grafana:12-debian13-dev@sha256:084445dea160e453576f5bd8e551116b0f1d6c52e8abd367d516135f53590c9a
            dest: grafana:12-debian13-dev
            auth: dhi
            dest_org: noomesh/dhi
          - source: dhi.io/loki:3@sha256:5f04dd8068afa17dd4da0fe1e88f56011d21a67dc1065b03c5de557971c7fa05
            dest: loki:3
            auth: dhi
            dest_org: noomesh/dhi
          - source: dhi.io/prometheus:3@sha256:6a5aea3fc3a33fea84bb4ea7925228f8eb67884893970a768603d350e1830489
            dest: prometheus:3
            auth: dhi
            dest_org: noomesh/dhi
          - source: dhi.io/alertmanager:0@sha256:01dd89cce4737ec7e44704681b5d6ee561e9b7880f632b4413b0e547e4dabfda
            dest: alertmanager:0
            auth: dhi
            dest_org: noomesh/dhi
          - source: dhi.io/node-exporter:1@sha256:2bf73eace0e49be4c1c61f14e349b738fdd182fb63560b1e7ed6c7c6885236d8
            dest: node-exporter:1
            auth: dhi
            dest_org: noomesh/dhi

          # ── dhi.io BUILD BASES (build-from-mirrors, 2026-08-20) ──────
          # The release workflow now builds first-party images FROM these
          # mirrors (--build-arg DHI_REGISTRY): dhi.io TLS timeouts have
          # broken four builds. The gateway runtime FROM is digest-pinned —
          # mirroring BY that digest preserves it (manifest copy). The
          # pytorch bases (vllm/airllm) are deliberately NOT mirrored:
          # multi-GB x3 tags of storage for rarely-rebuilt images.
          - source: dhi.io/rust:1-debian13-dev@sha256:be6c6ec91c61ae15b80521052df1c7f60fefd303293563b3dbd9f57e58783809
            dest: rust:1-debian13-dev
            auth: dhi
            dest_org: noomesh/dhi
          - source: dhi.io/python:3.12-debian13@sha256:4da000f376259ab2e5832ae781db58b04f2f67b9acc9f5b17ecc9568742e70b4
            dest: python:3.12-debian13
            auth: dhi
            dest_org: noomesh/dhi
          - source: dhi.io/uv:0-debian13-dev@sha256:538e03cfb921102dafe5a083a8fb4ee5a7758be4170f32788fac191325b0307d
            dest: uv:0-debian13-dev
            auth: dhi
            dest_org: noomesh/dhi
          - source: dhi.io/golang:1.26-debian13-dev@sha256:ef213048c25a7360bbb52e6b243a782a439e892fa5982ad55c95a4c3c7f9e552
            dest: golang:1.26-debian13-dev
            auth: dhi
            dest_org: noomesh/dhi
          - source: dhi.io/alpine-base:3.22@sha256:884b0d572ffb8715be033de215ca17e1c0a372615e65b3937f9a5ee568eb11c5
            dest: alpine-base:3.22
            auth: dhi
            dest_org: noomesh/dhi
          - source: dhi.io/postgres:18-alpine3.22-dev@sha256:9bb938ebc72adc10302318b4193fc2b72a80ca2d80c5c1f0a91077ed6e8807c2
            dest: postgres:18-alpine3.22-dev
            auth: dhi
            dest_org: noomesh/dhi

          # DHI lanes set dest_org `noomesh/dhi`: ghcr.io/noomesh/dhi/<name>,
          # a NESTED prefix in the org (list: scripts/dhi-images.txt). The
          # hardened bases are DHI Community images, so there is no
          # visibility requirement on these packages.
          # The nested prefix is what lets the SAME names (redis, loki, ...)
          # exist as PUBLIC upstream mirrors at ghcr.io/noomesh/<name> (the
          # `dest_org: noomesh` lanes below): the compose template
          # ${NOO_BASE_REGISTRY}/redis:... resolves under both. The DEFAULT
          # (compose and registry.rs PUBLIC_BASE_REGISTRY) is
          # ghcr.io/noomesh/dhi: every service key and data volume is handed
          # to uid 65532 (the runtime images' nonroot; redis and grafana stay
          # the -dev variants, whose image USER is root, and compose pins
          # them to 65532 with `user:` - i64. The runtime variants ship no
          # shell, and docker/redis-entrypoint.sh is sh). 0.6.0/0.6.1 pointed the public channel at
          # ghcr.io/noomesh (the upstream lanes below, other uids) and the
          # monitoring set restart-looped on `permission denied`.
          # tests/test_image_namespace_declarations.py pins every compose
          # ${NOO_BASE_REGISTRY} ref to a lane here of the same name:tag.
          # History: packages pushed under another owner were linked to a
          # different repository, which this repo's GITHUB_TOKEN cannot read,
          # and deps-core FROMs them - the first stack release died at
          # `uv: not found`. Pushing from THIS repo makes the package its own.
          #
          # Re-mirroring rather than granting keeps the property the namespace
          # move exists for: packages this repository creates and owns, with no
          # cross-repo permission to maintain. DHI Community images are Apache-2.0,
          # so these packages are public like the rest (attribution:
          # THIRD_PARTY_NOTICES.md).
          #
          # ── OFFICIAL images → the PUBLIC noomesh org (2026-08-19) ────
          # The upstream official equivalents of the DHI runtime images,
          # mirrored to ghcr.io/noomesh and RETAGGED to the exact tag strings
          # the compose expects. NOT the default and not what the public
          # channel seeds (since 0.6.2): they are a different image family
          # that runs as other uids (nobody/10001/472), so the stack's key
          # ACLs and data dirs do not fit them. Kept published for an
          # operator who chooses them deliberately and re-hands the keys.
          # Sources verified upstream 2026-08-19. Pushed with this repo's own
          # GITHUB_TOKEN (the repo lives in the noomesh org); flip these
          # packages PUBLIC after the first push.
          - source: redis:8@sha256:4764ce37931aac77c0d033680b339b19b4a4a81772204d268947cb851212d0ac
            dest: redis:8.6-debian13-dev
            dest_org: noomesh
          - source: grafana/grafana:12.2@sha256:d2ac2dae86601550e941f7e1c0b4b7e1f21fadebfa5956ba06fe0b3a64de7cf4
            dest: grafana:12-debian13-dev
            dest_org: noomesh
          - source: grafana/loki:3@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
            dest: loki:3
            dest_org: noomesh
          - source: prom/prometheus:v3@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
            dest: prometheus:3
            dest_org: noomesh
          - source: prom/alertmanager:v0@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
            dest: alertmanager:0
            dest_org: noomesh
          - source: prom/node-exporter:v1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
            dest: node-exporter:1
            dest_org: noomesh
    steps:
      - name: Checkout (the DHI privacy guard lives in scripts/)   # actions/checkout@v7.0.1
        if: matrix.auth == 'dhi' && github.repository == 'noomesh/noomesh'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Hub-sourced entries without `auth` (pgvector, redis, grafana, ...) read
      # docker.io too: log in with the same account when its secrets exist, so
      # they draw the account's allowance rather than the runner IP's anonymous
      # one. Present-but-rejected credentials fail the job.
      - name: Log in to Docker Hub (higher read limit)
        if: matrix.auth == '' && github.repository == 'noomesh/noomesh'
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: |
          if [ -n "${DHI_TOKEN:-}" ] && [ -n "${DHI_USERNAME:-}" ]; then
            if ! echo "$DHI_TOKEN" | docker login docker.io -u "$DHI_USERNAME" --password-stdin; then
              echo "::error::docker.io login failed with the configured DHI credentials"
              exit 1
            fi
          else
            echo "::notice::no DHI_USERNAME/DHI_TOKEN secrets - anonymous Hub reads"
          fi

      # dhi.io needs a login for the pull and Hub pulls benefit from an authenticated rate
      # limit. Both reuse the same Docker account already in secrets.
      - name: Log in to source registry
        if: matrix.auth != ''
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: |
          if [ -z "${DHI_TOKEN:-}" ]; then
            echo "::error::${{ matrix.auth }} source needs DHI_TOKEN; refusing to mirror a partial set"
            exit 1
          fi
          registry=docker.io
          [ "${{ matrix.auth }}" = "dhi" ] && registry=dhi.io
          echo "$DHI_TOKEN" | docker login "$registry" -u "$DHI_USERNAME" --password-stdin

      # imagetools COPIES THE MANIFEST LIST — every architecture the source
      # publishes survives. The previous `pull && tag && push` resolved to
      # the RUNNER's architecture and pushed a single-arch image, which
      # would strand arm64 nodes (host9, Jetson) on a mirror that has no
      # image for them. Copying by digest-list also avoids re-uploading
      # layers GHCR already has.
      - name: Mirror ${{ matrix.source }} → GHCR (multi-arch manifest copy)
        run: |
          dest_org="${{ matrix.dest_org || github.repository_owner }}"
          # Bounded retry with growing backoff: a transient 429 from either
          # registry must not fail the job; a real error still does after the
          # last attempt.
          for attempt in 1 2 3 4 5; do
            if docker buildx imagetools create \
                 --tag "ghcr.io/${dest_org}/${{ matrix.dest }}" \
                 "${{ matrix.source }}"; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "::warning::copy attempt ${attempt}/5 failed; retrying in $((20 * attempt))s"
              sleep $((20 * attempt))
            fi
          done
          echo "::error::copy failed after 5 attempts"
          exit 1

      - name: Verify the mirrored manifest
        run: |
          dest_org="${{ matrix.dest_org || github.repository_owner }}"
          echo "--- source ---"
          docker buildx imagetools inspect "${{ matrix.source }}" \
            | grep -E "^\s+Platform:" | sort > "$RUNNER_TEMP/src.txt" || true
          echo "--- mirror ---"
          docker buildx imagetools inspect \
            "ghcr.io/${dest_org}/${{ matrix.dest }}" \
            | grep -E "^\s+Platform:" | sort > "$RUNNER_TEMP/dst.txt"
          cat "$RUNNER_TEMP/dst.txt"
          # A mirror missing an architecture the source has is the exact
          # failure this rewrite exists to prevent — fail loudly, now.
          if ! diff -q "$RUNNER_TEMP/src.txt" "$RUNNER_TEMP/dst.txt" >/dev/null; then
            echo "::error::platform mismatch between source and mirror"
            diff "$RUNNER_TEMP/src.txt" "$RUNNER_TEMP/dst.txt" || true
            exit 1
          fi
