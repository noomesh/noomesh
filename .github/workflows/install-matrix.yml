# THROWAWAY PROBE on ci/install-matrix/fa-manifest-probe (never merged): the
# manifest the release's ollama installs vs the registry's for a plain client.
name: install matrix
on:
  push:
    branches: ['ci/install-matrix/**']
permissions:
  contents: read
concurrency:
  group: install-matrix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  manifest-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout   # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: scripts/install-cell/manifest_probe.py
          sparse-checkout-cone-mode: false
      - name: Pull with the release's ollama and compare
        run: |
          set -u
          img=ghcr.io/noomesh/ollama:v0.6.27-rc.2
          docker run -d --name probe-ollama "$img" >/dev/null || { echo "could not start $img"; exit 1; }
          sleep 8
          docker exec probe-ollama ollama --version || true
          for m in qwen2.5:0.5b gemma4:e2b; do
            n="${m%%:*}"; t="${m#*:}"
            docker exec probe-ollama ollama pull "$m" > /dev/null 2>&1; echo "pull $m rc=$?"
            got=""
            for root in /home/nonroot/.ollama /root/.ollama; do
              docker cp "probe-ollama:$root/models/manifests/registry.ollama.ai/library/$n/$t" "installed-$n.json" 2>/dev/null && { got="$root"; break; }
            done
            echo "installed manifest from: ${got:-none}"
            curl -s -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
              "https://registry.ollama.ai/v2/library/$n/manifests/$t" -o "registry-$n.json"
            python3 scripts/install-cell/manifest_probe.py "$m" "installed-$n.json" "registry-$n.json"
            echo "-- blobs for every installed entry (present? sha256 of the blob file):"
            for d in $(python3 -c "import json,sys; m=json.load(open(sys.argv[1])); print(' '.join([m['config']['digest']]+[l['digest'] for l in m['layers']]))" "installed-$n.json"); do
              h="${d#sha256:}"; f="$got/models/blobs/sha256-$h"
              if docker exec probe-ollama ls "$f" >/dev/null 2>&1; then echo "   present sha256-${h:0:12}"; else echo "   MISSING sha256-${h:0:12}"; fi
            done
            echo "-- the manifest-typed entries' blob contents (first 200 bytes):"
            python3 -c "import json,sys; m=json.load(open(sys.argv[1])); [print(l['digest']) for l in m['layers'] if 'manifest' in l.get('mediaType','')]" "installed-$n.json" | while read d; do
              h="${d#sha256:}"; docker cp "probe-ollama:$got/models/blobs/sha256-$h" "b-$h" 2>/dev/null && { echo "   ${h:0:12}: $(sha256sum < b-$h | cut -c1-12) $(head -c 200 b-$h | tr -d '\n')"; } || echo "   ${h:0:12}: not copyable"
            done
          done
