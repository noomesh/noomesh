# INSTALL TEST MATRIX: what a stranger gets from the README, on fresh
# machines we have never seen, every night (2026-11-12, launch Dec 1-3).
#
# Each cell runs the README's install line, onboards, starts the stack,
# verifies, gets one chat answer, then offboards and checks for leftovers.
# It records wall time per step, every prompt, every warning a healthy
# install shows, and the first error verbatim. A REPORT, not a gate: no
# required check depends on it, and it publishes nothing.
#
# GITHUB-HOSTED, EPHEMERAL RUNNERS ONLY. A cell pipes our released
# install.sh into sh, installs with sudo and tears the box down. Never run
# it on a machine someone owns or shares: it would do that to it.
#
# Triggers: nightly and dispatch run from the default branch (main), which
# only gets this file with a final. The push trigger runs it from any tree:
# push the commit to `ci/install-matrix/<anything>` (a pattern the mutants
# workflow's `wt/*-mut-*` can never match).
#
# Cells and owners: scripts/install-cell/run.sh drives every cell (97);
# prep-no-docker.sh and onboard-interactive.sh are the stranger-box cell's
# hooks (fa). A cell whose hook does not exist yet reports "not run".
name: install matrix

on:
  workflow_dispatch:
    inputs:
      cli_tag:
        description: 'Which release a cell installs: latest (the README line, verbatim) or a tag (noo-cli-vX.Y.Z)'
        default: latest
  schedule:
    - cron: '13 2 * * *'   # 02:13 UTC, away from the merge-queue peak
  push:
    branches: ['ci/install-matrix/**']

permissions:
  contents: read

concurrency:
  group: install-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cell:
    name: ${{ matrix.cell }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The stranger's default: --ci takes whatever onboard picks on a
          # GPU-less box (the 7.2 GB product default today). Time to first
          # answer and peak disk here are themselves a finding.
          - {cell: ubuntu-24.04-amd64-default, runner: ubuntu-24.04, docker: preinstalled, onboard: ci, model: default, scope: full, experimental: false}
          - {cell: ubuntu-22.04-amd64, runner: ubuntu-22.04, docker: preinstalled, onboard: ci, model: tiny, scope: full, experimental: false}
          # The engine most strangers get: Ubuntu's own `apt install docker.io`
          # (with docker-compose-v2), not the image's docker-ce. Same steps,
          # the 20x dockerd-restart probe included: that is where Docker 27
          # and 28 word a failed namespace join differently (noomesh#1128).
          - {cell: ubuntu-22.04-amd64-docker.io, runner: ubuntu-22.04, docker: distro, onboard: ci, model: tiny, scope: full, experimental: false}
          - {cell: ubuntu-24.04-arm64, runner: ubuntu-24.04-arm, docker: preinstalled, onboard: ci, model: tiny, scope: full, experimental: false, expect: refusal}
          - {cell: ubuntu-22.04-arm64, runner: ubuntu-22.04-arm, docker: preinstalled, onboard: ci, model: tiny, scope: full, experimental: false, expect: refusal}
          # fa: no Docker at all, the INTERACTIVE wizard through a pty.
          - {cell: stranger-24.04, runner: ubuntu-24.04, docker: none, onboard: interactive, model: default, scope: full, experimental: false}
          # i677 pass 1: Enter at EVERY prompt. The read says it cannot finish (no-default password; the default-No passphrase loop); where it stops is the result.
          - {cell: stranger-24.04-literal, runner: ubuntu-24.04, docker: none, onboard: interactive, model: default, scope: full, experimental: true}
          # A Mac is a node: it needs a controller a hosted runner cannot
          # reach, and hosted Apple silicon has no Docker. Install + CLI.
          - {cell: macos-15-node, runner: macos-15, docker: preinstalled, onboard: ci, model: tiny, scope: node-partial, experimental: false}
    steps:
      - name: Checkout (the cell harness only)   # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            README.md
            docs/getting-started/first-chat.md
            docs/getting-started/install.md
            scripts/install-cell
            scripts/ci-free-disk.sh
          sparse-checkout-cone-mode: false
      - name: Free disk (the runner's preinstalled toolchains; reported)
        if: runner.os == 'Linux'
        run: df -h / && bash scripts/ci-free-disk.sh && df -h /
      - name: Run the cell
        env:
          OUT: ${{ runner.temp }}/cell
          CELL: ${{ matrix.cell }}
          RUNNER: ${{ matrix.runner }}
          DOCKER: ${{ matrix.docker }}
          ONBOARD: ${{ matrix.onboard }}
          MODEL: ${{ matrix.model }}
          SCOPE: ${{ matrix.scope }}
          # expect: refusal (the arm64 cells): the cell asserts the controller refusal.
          EXPECT: ${{ matrix.expect || '' }}
          CLI_TAG: ${{ inputs.cli_tag || 'latest' }}
        run: bash scripts/install-cell/run.sh
      - name: Upload the cell's report (redacted; scanned by run.sh)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: install-cell-${{ matrix.cell }}
          path: ${{ runner.temp }}/cell/
          retention-days: 14
          if-no-files-found: warn

  # WSL2 is not documented for hosted Windows runners; a runner-images issue
  # reports WSL2 working on windows-2025. Experimental: if WSL2 or Docker in
  # it is refused, this cell says so verbatim and does not fail the run.
  wsl2:
    name: windows-2025-wsl2 (experimental)
    runs-on: windows-2025
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - name: Checkout (the cell harness only)   # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            README.md
            docs/getting-started/first-chat.md
            docs/getting-started/install.md
            scripts/install-cell
          sparse-checkout-cone-mode: false
      - name: WSL2 + Ubuntu 24.04   # Vampire/setup-wsl v7.2.0
        # Run 1 (2026-11-12) never finished this step in 45 min: cap it so a
        # hang reports as "WSL2 not coverable here" instead of eating the job.
        timeout-minutes: 15
        uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: curl ca-certificates python3
      - name: Docker inside WSL2 (what install.md asks of a Linux box)
        timeout-minutes: 15
        shell: wsl-bash {0}
        run: |
          set -eu
          curl -fsSL https://get.docker.com | sh
          if ! service docker start; then
            nohup dockerd >/tmp/dockerd.log 2>&1 &
          fi
          for i in $(seq 1 30); do docker version >/dev/null 2>&1 && break; sleep 2; done
          docker version
      - name: Run the cell inside WSL2
        shell: wsl-bash {0}
        env:
          CLI_TAG: ${{ inputs.cli_tag || 'latest' }}
          WSLENV: CLI_TAG   # environment variables reach WSL only when listed here
        run: |
          OUT="$PWD/cell-out" CELL=windows-2025-wsl2 RUNNER=windows-2025 DOCKER=preinstalled ONBOARD=ci \
            MODEL=tiny SCOPE=full CLI_TAG="${CLI_TAG:-latest}" bash scripts/install-cell/run.sh
      - name: Upload the cell's report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: install-cell-windows-2025-wsl2
          path: cell-out/
          retention-days: 14
          if-no-files-found: warn

  # What we ship and what an upgrading node downloads, for the newest final
  # against the one before (noomesh-internal i673). Registry reads only.
  size:
    name: release size
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout (tags, for the Dockerfiles at the release)   # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Size report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/release-size-report.py --json "$RUNNER_TEMP/release-size.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-size
          path: ${{ runner.temp }}/release-size.json
          retention-days: 30
