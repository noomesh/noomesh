# INSTALL TEST MATRIX: what a stranger gets from the README, on fresh
# machines we have never seen, every night (2026-11-12, launch Dec 1-3).
#
# Each cell runs the README's install line, onboards, starts the stack,
# verifies, gets one chat answer, then offboards and checks for leftovers.
# It records wall time per step, every prompt, every warning a healthy
# install shows, and the first error verbatim. A REPORT, not a gate: no
# required check depends on it, and it publishes nothing.
#
# GITHUB-HOSTED, EPHEMERAL RUNNERS ONLY. A cell pipes our released
# install.sh into sh, installs with sudo and tears the box down. Never run
# it on a machine someone owns or shares: it would do that to it.
#
# Triggers: nightly and dispatch run from the default branch (main), which
# only gets this file with a final. The push trigger runs it from any tree:
# push the commit to `ci/install-matrix/<anything>` (a pattern the mutants
# workflow's `wt/*-mut-*` can never match).
#
# Cells and owners: scripts/install-cell/run.sh drives every cell (97);
# prep-no-docker.sh and onboard-interactive.sh are the stranger-box cell's
# hooks (fa). A cell whose hook does not exist yet reports "not run".
# scripts/install-cell/upgrade.sh drives the upgrade cell (fa); dispatch with
# cells=upgrade to run it alone.
# scripts/install-cell/reboot.sh drives the reboot cell (fa): dispatch with
# cells=reboot (alone) or cells=all-plus-reboot. Never on schedule, never on `all`.
name: install matrix

on:
  workflow_dispatch:
    inputs:
      cli_tag:
        description: 'Which release a cell installs: latest (the README line, verbatim) or a tag (noo-cli-vX.Y.Z)'
        default: latest
      cells:
        description: 'all (every fresh-install cell and the upgrade cell), fresh (the fresh-install cells only), upgrade (the upgrade cell only), reboot (the reboot cell only: a KVM guest) or all-plus-reboot (all, and the reboot cell)'
        type: choice
        options: [all, fresh, upgrade, reboot, all-plus-reboot]
        default: all
      prev_tag:
        description: 'The upgrade cell only: the final it starts from (exactly noo-cli-vX.Y.Z, a published non-prerelease release below cli_tag). Empty: the newest final below cli_tag'
        default: ''
  schedule:
    - cron: '13 2 * * *'   # 02:13 UTC, away from the merge-queue peak
  push:
    branches: ['ci/install-matrix/**']

permissions:
  contents: read

concurrency:
  group: install-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cell:
    name: ${{ matrix.cell }}
    if: inputs.cells != 'upgrade' && inputs.cells != 'reboot'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The stranger's default: --ci takes whatever onboard picks on a
          # GPU-less box (the 7.2 GB product default today). Time to first
          # answer and peak disk here are themselves a finding.
          - {cell: ubuntu-24.04-amd64-default, runner: ubuntu-24.04, docker: preinstalled, onboard: ci, model: default, scope: full, experimental: false}
          # A/B for the speed report (i802): the default cell with the
          # shared Ollama at the compose default of 4 slots, not onboard's 1
          # on a new CPU-only install. On a one-box that daemon serves chat
          # too, so its slot count bears on chat prefill. Compare its
          # context-fit turns.json with the default cell's.
          - {cell: ubuntu-24.04-amd64-slots4, runner: ubuntu-24.04, docker: preinstalled, onboard: ci, model: default, scope: full, experimental: true, embed_slots: "4"}
          - {cell: ubuntu-22.04-amd64, runner: ubuntu-22.04, docker: preinstalled, onboard: ci, model: tiny, scope: full, experimental: false}
          # The engine most strangers get: Ubuntu's own `apt install docker.io`
          # (with docker-compose-v2), not the image's docker-ce. Same steps,
          # the 20x dockerd-restart probe included: that is where Docker 27
          # and 28 word a failed namespace join differently (noomesh#1128).
          - {cell: ubuntu-22.04-amd64-docker.io, runner: ubuntu-22.04, docker: distro, onboard: ci, model: tiny, scope: full, experimental: false}
          - {cell: ubuntu-24.04-arm64, runner: ubuntu-24.04-arm, docker: preinstalled, onboard: ci, model: tiny, scope: full, experimental: false, expect: refusal}
          - {cell: ubuntu-22.04-arm64, runner: ubuntu-22.04-arm, docker: preinstalled, onboard: ci, model: tiny, scope: full, experimental: false, expect: refusal}
          # fa: no Docker at all, the INTERACTIVE wizard through a pty.
          - {cell: stranger-24.04, runner: ubuntu-24.04, docker: none, onboard: interactive, model: default, scope: full, experimental: false}
          # i677 pass 1: Enter at EVERY prompt. The read says it cannot finish (no-default password; the default-No passphrase loop); where it stops is the result.
          - {cell: stranger-24.04-literal, runner: ubuntu-24.04, docker: none, onboard: interactive, model: default, scope: full, experimental: true}
          # A Mac is a node: it needs a controller a hosted runner cannot
          # reach, and hosted Apple silicon has no Docker. Install + CLI.
          - {cell: macos-15-node, runner: macos-15, docker: preinstalled, onboard: ci, model: tiny, scope: node-partial, experimental: false}
    steps:
      # FIRST, before anything else touches it: the free-text dispatch input
      # cli_tag, whole-string, as scripts/install-cell/validate_tag.sh holds it
      # (run.sh and upgrade.sh refuse it again on their own). run.sh splices it
      # into an install line it runs with `sh -c`
      # (tests/test_dispatch_inputs_never_reach_a_shell_raw.py).
      - name: Validate dispatch inputs
        shell: bash
        env:
          CLI_TAG: ${{ inputs.cli_tag || 'latest' }}
        run: |
          export LC_ALL=C
          re='^(latest|noo-cli-v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?)$'
          [[ $CLI_TAG =~ $re ]] || {
            printf '::error::cli_tag %q refused: must be exactly latest or noo-cli-vX.Y.Z with an optional -rc.N\n' "$CLI_TAG"; exit 1; }
      - name: Checkout (the cell harness only)   # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            README.md
            docs/getting-started/first-chat.md
            docs/getting-started/install.md
            scripts/install-cell
            scripts/ci-free-disk.sh
            # the verify row registry: ratchet.py maps a row name to its id
            # when the installed CLI prints none (before #1411)
            noo-cli/src/commands/cluster_verify/rows.rs
          sparse-checkout-cone-mode: false
      - name: Free disk (the runner's preinstalled toolchains; reported)
        if: runner.os == 'Linux'
        run: df -h / && bash scripts/ci-free-disk.sh && df -h /
      - name: Run the cell
        env:
          OUT: ${{ runner.temp }}/cell
          CELL: ${{ matrix.cell }}
          RUNNER: ${{ matrix.runner }}
          DOCKER: ${{ matrix.docker }}
          ONBOARD: ${{ matrix.onboard }}
          MODEL: ${{ matrix.model }}
          SCOPE: ${{ matrix.scope }}
          # expect: refusal (the arm64 cells): the cell asserts the controller refusal.
          EXPECT: ${{ matrix.expect || '' }}
          # embed_slots (the A/B cell): OLLAMA_EMBED_NUM_PARALLEL after onboard.
          EMBED_SLOTS: ${{ matrix.embed_slots || '' }}
          CLI_TAG: ${{ inputs.cli_tag || 'latest' }}
        run: bash scripts/install-cell/run.sh
      - name: Upload the cell's report (redacted; scanned by run.sh)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: install-cell-${{ matrix.cell }}
          path: ${{ runner.temp }}/cell/
          retention-days: 14
          if-no-files-found: warn

  # WSL2 is not documented for hosted Windows runners; a runner-images issue
  # reports WSL2 working on windows-2025. Experimental: if WSL2 or Docker in
  # it is refused, this cell says so verbatim and does not fail the run.
  wsl2:
    if: inputs.cells != 'upgrade' && inputs.cells != 'reboot'
    name: windows-2025-wsl2 (experimental)
    runs-on: windows-2025
    timeout-minutes: 120
    continue-on-error: true
    steps:
      # FIRST, before anything else touches it: the free-text dispatch input
      # cli_tag, whole-string, as scripts/install-cell/validate_tag.sh holds it
      # (run.sh and upgrade.sh refuse it again on their own). run.sh splices it
      # into an install line it runs with `sh -c`
      # (tests/test_dispatch_inputs_never_reach_a_shell_raw.py).
      - name: Validate dispatch inputs
        shell: bash
        env:
          CLI_TAG: ${{ inputs.cli_tag || 'latest' }}
        run: |
          export LC_ALL=C
          re='^(latest|noo-cli-v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?)$'
          [[ $CLI_TAG =~ $re ]] || {
            printf '::error::cli_tag %q refused: must be exactly latest or noo-cli-vX.Y.Z with an optional -rc.N\n' "$CLI_TAG"; exit 1; }
      - name: Checkout (the cell harness only)   # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            README.md
            docs/getting-started/first-chat.md
            docs/getting-started/install.md
            scripts/install-cell
            noo-cli/src/commands/cluster_verify/rows.rs
          sparse-checkout-cone-mode: false
      - name: WSL2 + Ubuntu 24.04   # Vampire/setup-wsl v7.2.0
        # Run 1 (2026-11-12) never finished this step in 45 min: cap it so a
        # hang reports as "WSL2 not coverable here" instead of eating the job.
        timeout-minutes: 15
        uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: curl ca-certificates python3
      - name: Docker inside WSL2 (what install.md asks of a Linux box)
        timeout-minutes: 15
        shell: wsl-bash {0}
        run: |
          set -eu
          curl -fsSL https://get.docker.com | sh
          if ! service docker start; then
            nohup dockerd >/tmp/dockerd.log 2>&1 &
          fi
          for i in $(seq 1 30); do docker version >/dev/null 2>&1 && break; sleep 2; done
          docker version
      - name: Run the cell inside WSL2
        shell: wsl-bash {0}
        env:
          CLI_TAG: ${{ inputs.cli_tag || 'latest' }}
          # Environment variables reach WSL only when listed here. GITHUB_REPOSITORY:
          # where HARNESS-E2E fetches the release's harness asset from.
          WSLENV: CLI_TAG:GITHUB_REPOSITORY
        run: |
          OUT="$PWD/cell-out" CELL=windows-2025-wsl2 RUNNER=windows-2025 DOCKER=preinstalled ONBOARD=ci \
            MODEL=tiny SCOPE=full CLI_TAG="${CLI_TAG:-latest}" bash scripts/install-cell/run.sh
      - name: Upload the cell's report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: install-cell-windows-2025-wsl2
          path: cell-out/
          retention-days: 14
          if-no-files-found: warn

  # What we ship and what an upgrading node downloads, for the newest final
  # against the one before (noomesh-internal i673). Registry reads only.
  # Plus the stack's memory at idle, MEASURED by two cells' probe-memory-
  # baseline (operator 2026-11-14): so it waits for the cells, and runs when
  # they fail (a cell without memory.json is reported "not measured: why").
  # THE UPGRADE CELL (fa, 2026-11-18): the first roll a real fleet makes. A
  # box on the previous final (resolved from the releases API: the newest
  # noo-cli-vX.Y.Z final below cli_tag, or the final prev_tag chooses) takes
  # cli_tag with `noo upgrade --all`, then a same-tag `noo upgrade --stack`.
  # systemd is PID 1 here,
  # which the rehearsal's dind cannot give: its self node never collects or
  # applies a bundle. One `UPGRADE <id> PASS|FAIL` line per assert (i908's
  # release check, i907 1b's netns unit, the agent's hold, the verify rows,
  # the journal, a chat answer after). Dispatch only: it judges a release.
  upgrade:
    name: ${{ matrix.cell }}
    if: github.event_name == 'workflow_dispatch' && inputs.cells != 'fresh' && inputs.cells != 'reboot'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    # Three docker legs, one cell and one judge. ce: the runner image's docker-ce
    # (the leg the job always had). distro: Ubuntu's `apt install docker.io` +
    # docker-compose-v2, installed by scripts/install-cell/distro-docker.sh, the
    # same script the fresh matrix's docker.io cell runs. compose-floor: the
    # runner's docker-ce (Engine 28+) with the pinned lowest supported Compose
    # (2.33.x) installed by scripts/install-cell/compose-floor.sh, sha256-verified
    # first; the judge FAILs if the leg did not run it. Each leg prints its
    # docker and compose versions (`UPGRADE LEG <leg> NOTE: docker <v>, compose <v>`).
    strategy:
      fail-fast: false
      matrix:
        include:
          - {leg: ce, runner: ubuntu-24.04, cell: upgrade-24.04, artifact: install-cell-upgrade-24.04}
          - {leg: distro, runner: ubuntu-22.04, cell: upgrade-22.04-distro, artifact: install-cell-upgrade-22.04-distro}
          - {leg: compose-floor, runner: ubuntu-24.04, cell: upgrade-24.04-compose-floor, artifact: install-cell-upgrade-24.04-compose-floor}
    steps:
      # FIRST, before anything else touches them: the free-text dispatch
      # inputs cli_tag and prev_tag, whole-string, as
      # scripts/install-cell/validate_tag.sh holds them (upgrade.sh and
      # upgrade_judge.py resolve refuse them again on their own)
      # (tests/test_dispatch_inputs_never_reach_a_shell_raw.py).
      - name: Validate dispatch inputs
        shell: bash
        env:
          CLI_TAG: ${{ inputs.cli_tag || 'latest' }}
          PREV_TAG: ${{ inputs.prev_tag }}
        run: |
          export LC_ALL=C
          re='^(latest|noo-cli-v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?)$'
          [[ $CLI_TAG =~ $re ]] || {
            printf '::error::cli_tag %q refused: must be exactly latest or noo-cli-vX.Y.Z with an optional -rc.N\n' "$CLI_TAG"; exit 1; }
          re='^(noo-cli-v[0-9]+\.[0-9]+\.[0-9]+)?$'
          [[ $PREV_TAG =~ $re ]] || {
            printf '::error::prev_tag %q refused: must be empty or exactly noo-cli-vX.Y.Z (a final)\n' "$PREV_TAG"; exit 1; }
      - name: Checkout (the cell harness only)   # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            README.md
            scripts/install-cell
            scripts/ci-free-disk.sh
            # the verify row registry: ratchet.py maps a row name to its id
            # when the installed CLI prints none (before #1411)
            noo-cli/src/commands/cluster_verify/rows.rs
          sparse-checkout-cone-mode: false
      - name: Free disk (the runner's preinstalled toolchains; reported)
        run: df -h / && bash scripts/ci-free-disk.sh && df -h /
      - name: Run the upgrade cell
        env:
          OUT: ${{ runner.temp }}/cell
          CELL: ${{ matrix.cell }}
          RUNNER: ${{ matrix.runner }}
          LEG: ${{ matrix.leg }}
          CLI_TAG: ${{ inputs.cli_tag || 'latest' }}
          # the chosen start, through env only (never interpolated into run:);
          # upgrade_judge.py resolve holds it to the strict rules
          PREV_TAG: ${{ inputs.prev_tag }}
          # read-only: the releases list (the previous final); never written
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/install-cell/upgrade.sh
      - name: Upload the cell's report (redacted; scanned by upgrade.sh)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/cell/
          retention-days: 14
          if-no-files-found: warn

  # THE REBOOT CELL (fa): after a reboot the stack comes back with NO command
  # (noo-hostd's BootRestore); `noo stack start` is only the remedy. A hosted
  # runner cannot be rebooted, so the box is a QEMU/KVM Ubuntu 24.04 guest. No
  # /dev/kvm: one `REBOOT kvm SKIP` line and a green job (never a fake pass).
  # Dispatch only; one `REBOOT <id> PASS|FAIL|SKIP|INFO` line per assert.
  reboot:
    name: reboot-24.04
    if: github.event_name == 'workflow_dispatch' && (inputs.cells == 'reboot' || inputs.cells == 'all-plus-reboot')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Validate dispatch inputs
        shell: bash
        env:
          CLI_TAG: ${{ inputs.cli_tag || 'latest' }}
        run: |
          export LC_ALL=C
          re='^(latest|noo-cli-v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?)$'
          [[ $CLI_TAG =~ $re ]] || {
            printf '::error::cli_tag %q refused: must be exactly latest or noo-cli-vX.Y.Z with an optional -rc.N\n' "$CLI_TAG"; exit 1; }
      - name: Checkout (the cell harness only)   # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            README.md
            scripts/install-cell
            noo-cli/src/commands/cluster_verify/rows.rs
          sparse-checkout-cone-mode: false
      - name: KVM and QEMU (the cell SKIPs by name when /dev/kvm is still unusable)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils cloud-image-utils
          ls -l /dev/kvm || echo "no /dev/kvm"
          df -h / /mnt
      - name: Run the reboot cell
        env:
          OUT: ${{ runner.temp }}/cell
          CELL: reboot-24.04
          RUNNER: ubuntu-24.04
          CLI_TAG: ${{ inputs.cli_tag || 'latest' }}
        run: bash scripts/install-cell/reboot.sh
      - name: Upload the cell's report (redacted; scanned by reboot.sh, which withholds logs and judge on a secret)   # actions/upload-artifact@v7.0.2
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: install-cell-reboot-24.04
          path: ${{ runner.temp }}/cell/
          retention-days: 14
          if-no-files-found: warn

  size:
    name: release size
    needs: cell
    if: always() && inputs.cells != 'upgrade' && inputs.cells != 'reboot'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout (tags, for the Dockerfiles at the release)   # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      # One download per measured cell: a cell that uploaded nothing fails
      # only its own download, and the report says so.
      - name: The memory-baseline cells' reports   # actions/download-artifact@v8.0.2
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: install-cell-ubuntu-24.04-amd64-default
          path: ${{ runner.temp }}/memory/install-cell-ubuntu-24.04-amd64-default
      - name: The memory-baseline cells' reports (22.04)   # actions/download-artifact@v8.0.2
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: install-cell-ubuntu-22.04-amd64
          path: ${{ runner.temp }}/memory/install-cell-ubuntu-22.04-amd64
      - name: Size report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          M="$RUNNER_TEMP/memory"
          python3 scripts/release-size-report.py --json "$RUNNER_TEMP/release-size.json" \
            --memory "ubuntu-24.04-amd64-default=$M/install-cell-ubuntu-24.04-amd64-default/memory.json" \
                     "ubuntu-22.04-amd64=$M/install-cell-ubuntu-22.04-amd64/memory.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      # The run's ratchet line: how many cells reported default chat NOT
      # JUDGED (a registry outage at onboard), so a run of them is noticed.
      - name: Every cell's report (the ratchet's NOT JUDGED count)   # actions/download-artifact@v8.0.2
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: install-cell-*
          path: ${{ runner.temp }}/cells
      - name: Ratchet NOT JUDGED cells
        run: python3 scripts/install-cell/ratchet.py run-summary "$RUNNER_TEMP/cells" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-size
          path: ${{ runner.temp }}/release-size.json
          retention-days: 30
