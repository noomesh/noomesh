# docker-compose.trellion-intel.yml — the Trellion Intelligent tier as an
# add-on OVERLAY.
#
# Composed by the launcher when `addons.trellion_intel: true` is declared in
# noomesh.yaml — the file list has one home, scripts/lib-compose.sh — and by
# nothing else. No `profiles:` in here, on purpose: composing this file IS the
# switch. A profile inside an overlay is a second switch a launcher can
# forget, leaving the container behind on stale configuration.
#
# The graph engine's container: NOO_WORKER_SURFACES=ml-intel serves
# worker.temporal.* + worker.api.heartbeat.run_ml (the TRELLION_ACTIONS shell
# — the subjects addons.rs::is_trellion_intel_subject gates). It is trellion
# with a different surface and its own image, so it EXTENDS the
# trellion service from docker-compose.trellion.yml rather than restating it
# (the trellion overlay is composed whenever this one is; both are add-ons). `extends` is
# the documented cross-file mechanism — YAML anchors do not cross files —
# and it copies the parent's whole definition, including the audited env
# allowlist: one block, no drift. The no-drift guard
# (tests/test_launcher_trellion_parity.py) reads the COMPOSED projection,
# `docker compose config`, not this file.
#
# Three things `extends` would carry that this service must NOT have, each
# cleared with `!reset` (compose ≥ 2.24; the launcher requires newer):
#   profiles   — the parent has no `profiles:` either; composing the
#                parent overlay is its only switch, and this file's
#                presence is the only switch here
#   ports      — trellion's parked 3199 mapping must not double-bind
#   build      — replaced wholesale (!override): the intel Dockerfile, its
#                own build args and package context; a merged
#                build would keep the parent's args and contexts
# Overrides:
#   image / pull_policy missing — its OWN image name. NOO_INTEL_IMAGE_PREFIX points
#     --dist installs at the image namespace; NOO_INTEL_IMAGE is the
#     launcher's escape hatch (lib-dist.sh::resolve_intel_image) for a
#     pinned stack tag that predates the dedicated image. Dist installs never build (pull only).
#   NOO_WORKER_SURFACES=ml-intel — the surface
#   NOO_SKIP_MIGRATIONS=1 — the memory Alembic env runs ONLY in the trellion
#     container; a second runner would race it
#   NOO_GATEWAY_KEY_FILE + the `noo_gateway_key` secret — this container's
#     OWN gateway credential, as a FILE.
#     Declared HERE and deliberately NOT in the shared x-trellion-env anchor:
#     the point of a per-consumer key is that exactly one consumer holds it
#     (tests/test_per_consumer_key_is_not_shared.py). Unset on every install
#     until a key is minted: trellion's gateway_auth.py falls through to
#     the shared HMAC when the pointer is unset.
# ── What this add-on's gateway key asks for ──────────
# `x-noo-addon` is the ONE place this add-on's per-consumer key is declared.
# noo-cli's build script reads it from this file and derives the secret
# registry row (`noo security secrets` rotate/audit/doctor), the default
# grant `noo security service-key provision trellion-intel` shows and asks the
# operator to confirm, and the `cluster verify` grants check. The overlay
# only ASKS: the operator grants at provision, or by enabling the add-on
# (`noo addons enable`, which shows the same request first), and the gateway
# decides what each word opens (`GET /api/security/service-keys/scopes`).
#
# Compose never reads an `x-` key, so this block has no runtime effect. It is
# read PER FILE and never from `docker compose config`: compose merges
# top-level `x-` keys across `-f` files, so the merged projection shows only
# the last overlay's block. tests/test_addon_declares_its_grant.py pins the
# block against this file's own NOO_GATEWAY_KEY interpolation, both ways.
#
# Top-level, not on the service, on purpose: `trellion-intel` EXTENDS
# trellion, and a service-level block would be inherited, so this container
# would ask for trellion's grant unless someone remembered to override it.
# Its own key makes a rotation or revocation touch this consumer alone.
x-noo-addon:
  addon: trellion_intel
  consumer: svc:trellion-intel
  key: NOO_SVC_KEY_TRELLION_INTEL
  containers: [noo-trellion-intel]
  scopes: [chat, embeddings, metrics]
  why: >-
    the graph engine's extraction calls the gateway's chat and embeddings, and
    its counters post to the gateway's metrics door.

# Intel's own key, sourced from the launcher's environment like every other
# file-delivered secret (compose merges top-level `secrets:` across files).
secrets:
  noo_svc_key_trellion_intel:
    environment: NOO_SVC_KEY_TRELLION_INTEL

services:
  trellion-intel:
    extends:
      file: docker-compose.trellion.yml
      service: trellion
    profiles: !reset []
    ports: !reset []
    # No build recipe here: `extends` would otherwise inherit trellion's build
    # block, so it is reset. Dev builds of intel use this repo's own
    # Dockerfile (docker/Dockerfile.trellion-intel) from now on; dist installs
    # pull only.
    build: !reset null
    image: ${NOO_INTEL_IMAGE:-${NOO_INTEL_IMAGE_PREFIX:-${NOO_IMAGE_PREFIX:-noomesh}}/trellion-intel:${NOO_IMAGE_TAG:-latest}${NOO_IMAGE_DIGEST_TRELLION_INTEL:-}}
    pull_policy: missing
    container_name: ${NOO_CONTAINER_PREFIX:-noo}-trellion-intel
    # Inherits trellion's file-delivered secrets through `extends`: compose
    # MERGES the environment map (so every `<NAME>_FILE` pointer arrives)
    # and merges the `secrets:` list BY TARGET (measured on compose v5.0.2).
    # Both overrides below are therefore needed and sufficient: the pointer
    # names intel's own variable, and the `noo_gateway_key` target is
    # re-sourced from intel's own secret — without the second, intel would
    # hold trellion's key under its own pointer and present it.
    # tests/test_compose_secret_files.py
    # `test_each_add_on_gateway_key_file_is_sourced_from_its_own_key`
    # resolves pointer → target → source → variable in the projection.
    environment:
      NOO_WORKER_SURFACES: ml-intel
      NOO_SKIP_MIGRATIONS: '1'
      NOO_GATEWAY_KEY_FILE: '${NOO_SVC_KEY_TRELLION_INTEL:+/run/secrets/noo_gateway_key}'
      # Intel's OWN bus-principal key and audience, the
      # same two overrides as the gateway key: without them intel would
      # verify with trellion's key under trellion's name.
      NOO_BUS_KEY_FILE: '${NOO_BUS_KEY_TRELLION_INTEL:+/run/secrets/noo_bus_key}'
      NOO_BUS_AUDIENCE: trellion-intel
    secrets:
      - { source: noo_svc_key_trellion_intel, target: noo_gateway_key, uid: "65532", gid: "65532", mode: 0400 }
      - { source: noo_bus_key_trellion_intel, target: noo_bus_key, uid: "65532", gid: "65532", mode: 0400 }
    # Intel's OWN service leaf at the path the shared env names (/app/pki/leaf).
    # `extends` merges `volumes` BY TARGET, so this replaces
    # trellion's `services/trellion` entry rather than adding a second leaf:
    # each container holds exactly one key, its own.
    # tests/test_addons_present_own_leaf.py resolves it in the projection.
    volumes:
      - ${NOO_PKI_DIR:-./.pki-placeholder}/services/trellion-intel:/app/pki/leaf:ro
