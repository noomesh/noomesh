# Alertmanager configuration (H-L4).
#
# Criticals (severity="critical") go to the gateway's intake,
# POST https://gateway:8080/api/alerts/alertmanager (i515b): it raises the
# operator's persisting operator_alert on firing and clears it on resolved,
# with the gateway's own sentence ("critical alert <alertname> firing on
# <target>") — the alert's annotations are logged, never sent — and a flap
# guard (one onset per alert and target per 30 minutes). The intake answers
# Alertmanager's own service leaf only, so the receiver dials with
# services/alertmanager/service.{crt,key}, the leaf the healthcheck uses.
#
# Everything else routes to a no-op ('null') receiver: the alerting pipeline
# is still LIVE — alerts fire and are visible in the Prometheus and
# Alertmanager UIs — without a notification for each warning.
# tests/test_alertmanager_criticals_reach_gateway.py pins this routing.
global:
  resolve_timeout: 5m

route:
  receiver: 'null'
  group_by: ['alertname', 'category']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    - matchers:
        - severity = "critical"
      receiver: 'gateway'
      repeat_interval: 1h

receivers:
  - name: 'null'
  - name: 'gateway'
    webhook_configs:
      - url: 'https://gateway:8080/api/alerts/alertmanager'
        send_resolved: true
        # The intake refuses a payload of more than 100 alerts.
        max_alerts: 100
        http_config:
          tls_config:
            ca_file: /app/pki/ca.crt
            cert_file: /app/pki/services/alertmanager/service.crt
            key_file: /app/pki/services/alertmanager/service.key
            insecure_skip_verify: false
