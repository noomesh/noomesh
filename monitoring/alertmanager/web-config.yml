# Alertmanager TLS + mTLS configuration.
# See: https://prometheus.io/docs/alerting/latest/https/
#
# Its clients are Prometheus (services/prometheus) and the gateway, which
# reads GET /api/v2/alerts for `noo_alerts_list` (operator-only, read-only)
# with its own cluster leaf like its PromQL route. It used
# to serve plain HTTP with no credential on the compose network and on
# 127.0.0.1:9093; alerts carry node names, rates and security signals, which
# are an operator's view. Issue the leaf with
# `noo security pki issue-service alertmanager`; without it the container
# does not start, which is the point.
tls_server_config:
  cert_file: /app/pki/services/alertmanager/service.crt
  key_file: /app/pki/services/alertmanager/service.key
  client_ca_file: /app/pki/ca.crt
  client_auth_type: RequireAndVerifyClientCert
  # RequireAndVerifyClientCert admits ANY cluster-CA leaf, node leaves
  # included, and Alertmanager can create silences. exporter-toolkit's
  # client_allowed_sans narrows that: the handshake succeeds only when one
  # of the leaf's SANs (DNS, IP, e-mail or URI) EXACTLY equals an entry here
  # (the subject CN is never consulted). No wildcards, and never "localhost"
  # (every leaf carries it). Names come from the issuers in noo-cli/src/pki.rs:
  #   noo-gateway   every gateway leaf (the gateway's noo_alerts_list read)
  #   prometheus    services/prometheus (its alerting push)
  #   alertmanager  services/alertmanager (the amtool healthcheck presents it)
  # tests/test_monitoring_web_configs_are_loaded.py pins this list.
  client_allowed_sans:
    - noo-gateway
    - prometheus
    - alertmanager
  min_version: TLS12
