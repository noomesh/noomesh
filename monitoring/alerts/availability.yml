# Availability / liveness alerting rules (H-L4).
groups:
  - name: availability
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Prometheus target down: {{ $labels.job }} ({{ $labels.instance }})"
          description: "Scrape target has been unreachable for >2m."

      - alert: GatewayDown
        expr: absent(noo_gateway_up) or noo_gateway_up == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "PAI gateway is not reporting up"
          description: "noo_gateway_up is absent or 0 for >1m — the gateway may be down."

      # 2026-11-02: the pop-os gateway reached RLIMIT_NOFILE (1024) after ~45 h
      # and could not read its secrets or reach Postgres for five hours.
      # The gateway exports both gauges (fd_watch.rs) and alerts on its own;
      # this rule is the same 70% line, from outside the process.
      - alert: GatewayFdsHigh
        expr: process_open_fds{job="gateway"} / process_max_fds{job="gateway"} > 0.7
        for: 10m
        labels:
          severity: warning
          category: availability
        annotations:
          summary: "Gateway holds {{ $value | humanizePercentage }} of its fd limit"
          description: "process_open_fds / process_max_fds > 70% for >10m. At the limit the gateway cannot open sockets, secret files or DB connections. `noo cluster verify` (gateway fds); restart with `noo stack restart gateway`."

      - alert: NatsDLQBacklog
        expr: nats_dlq_pending > 100
        for: 10m
        labels:
          severity: warning
          category: availability
        annotations:
          summary: "NATS dead-letter backlog growing ({{ $value }})"
          description: "nats_dlq_pending={{ $value }} for >10m — a consumer may be failing."

      # Sustained disk writes wear consumer SSDs. A week of Postgres sort
      # spills ran ~130 MB/s (60 TB/7d) on a 1 TB NVMe with nothing alerting.
      - alert: DiskWriteSustainedHigh
        expr: rate(node_disk_written_bytes_total[1h]) > 50e6
        for: 2h
        labels:
          severity: warning
          category: availability
        annotations:
          summary: "Sustained high disk writes on {{ $labels.device }} ({{ $labels.instance }}): {{ $value | humanize }}B/s"
          description: "node_disk_written_bytes_total on {{ $labels.device }} has averaged >50 MB/s for 2h. Sustained writes wear consumer SSDs; check `docker stats` (block I/O) and Postgres temp files (`docker logs noo-postgres`, log_temp_files)."
