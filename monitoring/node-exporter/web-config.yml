# node-exporter TLS + mTLS configuration
# See: https://prometheus.io/docs/prometheus/latest/configuration/https/
tls_server_config:
  cert_file: /tls/services/node-exporter/service.crt
  key_file: /tls/services/node-exporter/service.key
  client_ca_file: /tls/ca.crt
  client_auth_type: RequireAndVerifyClientCert
  min_version: TLS12
