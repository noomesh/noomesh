global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'noomesh'
    environment: 'production'

# Alerting configuration
alerting:
  alertmanagers:
    - scheme: https
      tls_config:
        ca_file: /app/pki/ca.crt
        cert_file: /app/pki/services/prometheus/service.crt
        key_file: /app/pki/services/prometheus/service.key
        insecure_skip_verify: false
      static_configs:
        - targets: ['alertmanager:9093']

# Load rules once and periodically evaluate them
rule_files:
  - "/etc/prometheus/alerts/*.yml"

# NOTE: The inline prometheus_config in docker-compose.cluster.yml is the
# primary config used in production.  This file is kept as a reference and
# for standalone/external Prometheus deployments.
#
# an earlier change: every job scrapes with services/prometheus/service.{crt,key}
# (CN=prometheus, O="Mesh Cluster Service"). It must never be changed back to
# gateway/gateway.{crt,key}: that leaf is what a node agent reads as "this
# caller is the controller", and handing it to the scraper makes Prometheus
# able to /start, /stop, /clean and /pull on every node it can reach. The
# service leaf reaches GET /metrics and nothing else. Issue it with
# `noo security pki issue-service prometheus`.
#
# No job sends a bearer: the leaf IS the credential. The
# gateway admits it on GET /metrics only; the node agent on /metrics only.

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    scheme: https
    tls_config:
      ca_file: /app/pki/ca.crt
      cert_file: /app/pki/services/prometheus/service.crt
      key_file: /app/pki/services/prometheus/service.key
      insecure_skip_verify: false
    static_configs:
      - targets: ['localhost:9090']

  # PAI Gateway
  - job_name: 'gateway'
    scheme: https
    tls_config:
      ca_file: /app/pki/ca.crt
      cert_file: /app/pki/services/prometheus/service.crt
      key_file: /app/pki/services/prometheus/service.key
      insecure_skip_verify: false
    static_configs:
      - targets: ['gateway:8080']

  # Node exporter (system metrics)
  - job_name: 'node'
    scheme: https
    tls_config:
      ca_file: /app/pki/ca.crt
      cert_file: /app/pki/services/prometheus/service.crt
      key_file: /app/pki/services/prometheus/service.key
      insecure_skip_verify: false
    static_configs:
      - targets: ['node-exporter:9100']

  # NVIDIA GPU exporter
  - job_name: 'nvidia_gpu'
    scheme: https
    tls_config:
      ca_file: /app/pki/ca.crt
      cert_file: /app/pki/services/prometheus/service.crt
      key_file: /app/pki/services/prometheus/service.key
      insecure_skip_verify: false
    static_configs:
      - targets: ['nvidia-exporter:9400']

  # The node agents (i669). Not a static target: `node-agent:8081` named a
  # compose service that exists only under the node-agent-compose profile, so
  # on the fleet (agents are host units) it was never up. The gateway lists
  # the registered agents, at the address it dials them itself, and only those
  # whose leaf carries a SAN for that address
  # (GET /api/internal/prometheus/targets/node-agents, the scraper's leaf
  # only). If the gateway cannot answer, Prometheus keeps the last list it
  # fetched. The scrape verifies server names: a wrong target fails closed.
  - job_name: 'noo_node_agent'
    scheme: https
    tls_config:
      ca_file: /app/pki/ca.crt
      cert_file: /app/pki/services/prometheus/service.crt
      key_file: /app/pki/services/prometheus/service.key
      insecure_skip_verify: false
    http_sd_configs:
      - url: 'https://gateway:8080/api/internal/prometheus/targets/node-agents'
        refresh_interval: 60s
        tls_config:
          ca_file: /app/pki/ca.crt
          cert_file: /app/pki/services/prometheus/service.crt
          key_file: /app/pki/services/prometheus/service.key
          insecure_skip_verify: false
    metrics_path: '/metrics'
