# NATS configuration — mTLS enabled
jetstream {
  store_dir: /data
}
# Largest message the server accepts. This IS the NATS default (1 MiB);
# declaring it makes the bound a reviewed fact rather than an inherited one
# (an earlier change N11). The largest legitimate payload is an agent envelope
# whose body is capped at 256 KiB by the gateway (`agent_messages.rs`,
# MAX_BODY_BYTES) plus its wrapping; job dispatches and KV values are far
# smaller. Raise it here, deliberately, if a new producer needs more.
max_payload: 1MB
# Monitoring over the cluster's own mTLS, NOT plain HTTP (an earlier change N9).
# `/connz?auth=1` returns the bus username and every client's IP, `/subsz`
# every subject and `/jsz` every stream — and `noo-cluster` carries
# third-party images (vllm, ollama, grafana, loki, the headless browser)
# that have no business enumerating the bus. `https_port` reuses the `tls`
# block below, so `verify: true` applies here too: reading monitoring now
# needs a cluster-CA client certificate. The gateway has one.
#
# Operator diagnostic from the host (the published port is unchanged):
#   curl --cacert .pki/ca.crt --cert .pki/services/gateway/service.crt \
#        --key .pki/services/gateway/service.key -k \
#        https://127.0.0.1:8222/varz
https_port: 8222
server_name: pai-nats

# Authorization comes from users.conf: one NATS user per principal, subject
# permissions per user. There is NO shared user: the renderer
# cannot emit one since an earlier change retired it, `noo onboard` renders and
# fails the onboard if it cannot, and `noo upgrade --stack` re-renders an
# older file that still names `$NATS_USER` before it launches — so the stack
# never comes up on a `>`/`>` credential everything shares.
#
# The COMMITTED users.conf is a placeholder that authenticates nobody. That
# is deliberate: NATS treats a missing include as a fatal startup error, so
# the file must exist, and a file that grants nothing is the only baseline
# that fails loudly instead of running open. An empty `users: []` does NOT
# do that — it removes authentication from the bus altogether (measured;
# see the comment in users.conf).
#
# Users are NOT in a top-level `authorization` block, and that is not a
# tidy-up: with an `accounts` block present, top-level authorization users
# land in the global account `$G`, and a `$G` client cannot see the `NOO`
# account's subjects at all.
#
# History of the shared user's retirement: docs/operating/runbooks/nats-isolation.md. `curl .../connz?auth=1` is how
# you see which user each session is really presenting.
include users.conf

tls {
  cert_file: /tls/services/nats/service.crt
  key_file: /tls/services/nats/service.key
  ca_file: /tls/ca.crt
  verify: true
}
