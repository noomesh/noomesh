#
# ── Why a placeholder user and not an empty `users: []` ──────────────────
#
# Because an empty user list removes authentication from the bus entirely.
# Measured against the pinned image
# (nats@sha256:7ff2e641…, `/varz` after boot):
#
#   accounts { NOO: { jetstream: enabled, users: [] } }  ->  auth_required absent
#   this file (one user, unusable digest)                ->  auth_required: true
#
# So the "obviously safe" empty list is the open one: every client on
# `noo-cluster` connects anonymously and the server accepts it. The file
# must name at least one user for NATS to demand a credential at all — and
# the safest such user is one whose credential nobody holds.
#
# The password below is a real bcrypt digest (cost 11) of a 32-character
# random value that was generated, hashed and discarded in one step. No
# plaintext for it exists anywhere. Both permission sets deny `>`, so even
# an impossible authentication would carry no rights.
#
# ── What the rendered file looks like instead ────────────────────────────
#
# One NATS user per principal: `gateway`, `worker`, and one
# `node-<id>` per node — and nothing else: the shared user was retired
#, and the rendered file names no environment variable. Isolation is per-user subject permissions inside ONE
# account, because the gateway, the workers and the nodes share streams and
# KV buckets. Passwords are bcrypt digests there too: the rendered file
# holds nothing an attacker can present, and the plaintext lives only in
# secrets/env.sops and on the node that owns it.
#
# `include`d by nats.conf and nats-tls.conf. NATS treats a missing include
# as a fatal startup error, which is why this file is committed at all.
# Reload without dropping sessions: docker kill -s HUP noo-nats

