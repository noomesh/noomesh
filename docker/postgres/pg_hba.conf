# Postgres client authentication for the noomesh controller — the file the
# postgres service runs with (`-c hba_file=/etc/noo/pg_hba.conf` in
# docker-compose.cluster.yml), REPLACING the one initdb writes into PGDATA.
#
# The doctrine (2026-09-28, "ensure full TLS coverage"): every TCP client
# speaks TLS AND presents a certificate that chains to the cluster CA, AND
# still knows its role's password. There is no plaintext path and no
# password-only path. Rules are matched top to bottom, first match wins:
#
#   local      — the unix socket, reachable only from INSIDE the container
#                (`docker exec`, which is root-equivalent on the host
#                already). The image entrypoint's own first-init
#                (`createdb` over the socket), the healthcheck's
#                `pg_isready`, `noo security secrets rotate|resync`'s
#                ALTER ROLE, pg_dump for backups and the schema-baseline
#                scripts all use it. `trust` here is what lets a rotation
#                of the superuser password itself run without the old one.
#   hostssl    — every TCP client, from any address: password (scram) AND
#                `clientcert=verify-ca`: the presented certificate must
#                chain to `ssl_ca_file` (the cluster CA). verify-ca, not
#                verify-full: verify-full would ALSO require the cert's CN
#                to equal the database role, and our leaves are named for
#                the service that holds them (`gateway`, `evolve`,
#                `postgres`), not for roles — five roles share the gateway
#                leaf. Mapping CN→role is an earlier change; it is not what
#                closes the plaintext finding.
#   hostnossl  — a TCP client that did not start TLS is refused outright,
#                before any authentication. `reject` rather than a missing
#                line so the refusal reads as a decision in the log.
#
# The 127.0.0.1/::1 `trust` lines initdb writes are deliberately ABSENT: a
# loopback TCP connection inside the container is a TCP connection and is
# held to the same rule. (They are also why every password probe over
# loopback used to pass with any password — noo-cli/src/commands/secrets.rs.)
#
# Replication: the same TLS + certificate rule. A standby presents its own
# leaf, `services/postgres-standby` (issued by onboard and `noo upgrade
# --stack`), with sslmode=verify-full — scripts/bootstrap-standby.sh stages
# it in the standby's data volume.
#
# Guarded by tests/test_postgres_tls_only.py and the `postgres hba` row of
# `noo cluster verify --controller`.

# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
local   replication     all                                     trust
hostssl all             all             all                     scram-sha-256   clientcert=verify-ca
hostssl replication     all             all                     scram-sha-256   clientcert=verify-ca
hostnossl all           all             all                     reject
hostnossl replication   all             all                     reject
