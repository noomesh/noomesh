# Postgres client authentication for the noomesh controller — the file the
# postgres service runs with (`-c hba_file=/etc/noo/pg_hba.conf` in
# docker-compose.cluster.yml), REPLACING the one initdb writes into PGDATA.
#
# The doctrine (2026-09-28, "ensure full TLS coverage"): every TCP client
# speaks TLS AND presents a certificate that chains to the cluster CA, AND
# still knows its role's password. There is no plaintext path and no
# password-only path. Rules are matched top to bottom, first match wins:
#
#   local      — the unix socket, reachable only from INSIDE the container
#                (`docker exec`, which is root-equivalent on the host
#                already). The image entrypoint's own first-init
#                (`createdb` over the socket), the healthcheck's
#                `pg_isready`, `noo security secrets rotate|resync`'s
#                ALTER ROLE, pg_dump for backups and the schema-baseline
#                scripts all use it. `trust` here is what lets a rotation
#                of the superuser password itself run without the old one.
#   hostssl    — every TCP client: TLS, a client certificate from the
#                cluster CA, AND the role's password. Three tiers, matched
#                top to bottom (first match wins on database/user/address,
#                not on whether the login then succeeds):
#
#                1. `samehost` + verify-ca: a connection from one of the
#                   server's OWN addresses, i.e. a process inside this
#                   container. `noo security secrets rotate|audit` proves a
#                   rotated password by logging in as the role over the
#                   container's routable address, presenting the SERVER's
#                   leaf (CN=postgres), which names no role. This is no new
#                   door: the same process can already use the `local` trust
#                   line above, and a peer on `noo-db` arrives from its own
#                   address, never from this one.
#                2. Per-role identity (i132): for each role a container in
#                   this repo connects as, `clientcert=verify-full`. With
#                   scram this makes Postgres require the certificate's CN to
#                   equal the database role being asked for, so the leaf
#                   `services/pg-noo_app` (CN=noo_app) can log in as noo_app
#                   and as nothing else, and the gateway's own leaf (CN=its
#                   host name) can log in as no role at all. The password is
#                   still required: a stolen role leaf alone reaches scram,
#                   not the data. The list is noo-cli/src/pki.rs
#                   PG_LEAVES; tests/test_postgres_role_identity.py
#                   pins the two together. (A `map=` + `cert` method would
#                   drop the password from the TCP path; verify-full keeps
#                   both.)
#                3. Everyone else, verify-ca: the roles whose clients live in
#                   other repos and present their own service leaf
#                   (noo_evolve, noo_evolve_ddl in the evolve add-on) and the
#                   standby's `replicator`. They get a tier-2 line when
#                   their repos present a leaf named for the role.
#
#                An older client (the shared gateway or worker leaf) is
#                refused at tier 2: `noo upgrade --stack` issues the role
#                leaves BEFORE it recreates anything, and the same release's
#                compose mounts them, so the clients and this file change in
#                one roll.
#
#                The network still matters: postgres answers only on `noo-db`
#                (internal; its members are its clients), so a leaf stolen from
#                a backend, nginx or a monitoring container has no route to
#                this port at all. tests/test_db_networks_are_isolated.py
#                pins the member list.
#
#                The `local` trust lines stay: the socket exists only inside
#                the container (`docker exec`, root-equivalent on the host
#                already), and `peer` cannot replace it - the backup script,
#                `secrets rotate` and the healthcheck connect as the role
#                `noo` from whatever OS user `docker exec` runs as, which is
#                not named `noo`, and the first-init `createdb` runs before
#                any role or password exists.
#
#   hostnossl  — a TCP client that did not start TLS is refused outright,
#                before any authentication. `reject` rather than a missing
#                line so the refusal reads as a decision in the log.
#
# The 127.0.0.1/::1 `trust` lines initdb writes are deliberately ABSENT: a
# loopback TCP connection inside the container is a TCP connection and is
# held to the same rule. (They are also why every password probe over
# loopback used to pass with any password — noo-cli/src/commands/secrets.rs.)
#
# Replication: the same TLS + certificate rule. A standby presents its own
# leaf, `services/postgres-standby` (issued by onboard and `noo upgrade
# --stack`), with sslmode=verify-full — scripts/bootstrap-standby.sh stages
# it in the standby's data volume.
#
# Guarded by tests/test_postgres_tls_only.py and the `postgres hba` row of
# `noo cluster verify --controller`.

# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
local   replication     all                                     trust
# 1. a process inside this container (the rotation login probe).
hostssl all             all             samehost                scram-sha-256   clientcert=verify-ca
# 2. one leaf per role, CN == role (PG_LEAVES in noo-cli/src/pki.rs).
hostssl all             noo             all                     scram-sha-256   clientcert=verify-full
hostssl all             noo_app         all                     scram-sha-256   clientcert=verify-full
hostssl all             noo_trellion    all                     scram-sha-256   clientcert=verify-full
hostssl all             noo_trellion_ddl all                    scram-sha-256   clientcert=verify-full
# 3. every other role: a cluster-CA certificate and the password.
hostssl all             all             all                     scram-sha-256   clientcert=verify-ca
hostssl replication     all             all                     scram-sha-256   clientcert=verify-ca
hostnossl all           all             all                     reject
hostnossl replication   all             all                     reject
