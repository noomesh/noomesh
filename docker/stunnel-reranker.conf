; stunnel mTLS proxy for the reranker (TEI cross-encoder, GPU)
; Accepts mTLS on :443, forwards plain HTTP to reranker:80

foreground = yes
pid =

[reranker]
accept = 0.0.0.0:443
connect = reranker:80
cert = /tls/services/reranker/service.crt
key = /tls/services/reranker/service.key
CAfile = /tls/ca.crt
verify = 2
