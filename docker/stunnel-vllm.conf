; stunnel mTLS door for vllm (the engine serves no TLS of its own)
; Accepts mTLS on its bridge address :8000 and forwards plain HTTP to
; 127.0.0.1:8000: the engine shares this container's network namespace and
; listens on loopback only, so this door is the only way in. The door joins
; noo-cluster under the engine's names, so callers still dial
; https://noo-vllm:8000; the `vllm` leaf carries that name.

foreground = yes
pid =

[vllm]
accept = noo-stunnel-vllm:8000
connect = 127.0.0.1:8000
cert = /tls/services/vllm/service.crt
key = /tls/services/vllm/service.key
CAfile = /tls/ca.crt
verify = 2
; Peer pinning (i132): the same callers as every compose door
; (docker/stunnel-llamacpp.conf has the reasoning); compose's
; `stunnel-self-pin` entrypoint appends `checkHost = $NODE_ID` for the
; controller's own host node-agent.
checkHost = gateway
checkHost = worker
checkHost = trellion
checkHost = trellion-intel
checkHost = evolve
