; stunnel mTLS proxy for the optional CPU-only embedder (compose profile
; `embed-cpu`, service ollama-embed-cpu). Same shape as
; stunnel-ollama-embed.conf: accepts mTLS on :11434, forwards plain HTTP to
; ollama-embed-cpu:11434 on the compose network. verify = 2: a caller
; without a cluster-CA client certificate is refused at the handshake.

foreground = yes
pid =

[ollama-embed-cpu]
accept = 0.0.0.0:11434
connect = ollama-embed-cpu:11434
cert = /tls/services/ollama-embed-cpu/service.crt
key = /tls/services/ollama-embed-cpu/service.key
CAfile = /tls/ca.crt
verify = 2
