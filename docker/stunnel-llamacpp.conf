; stunnel mTLS proxy for llama.cpp (llama-server has no TLS listener)
; Accepts mTLS on :8085, forwards plain HTTP to llamacpp:8085

foreground = yes
pid =

[llamacpp]
accept = 0.0.0.0:8085
connect = llamacpp:8085
cert = /tls/services/llamacpp/service.crt
key = /tls/services/llamacpp/service.key
CAfile = /tls/ca.crt
verify = 2
; Peer pinning (i132): a certificate from the cluster CA is necessary, not
; sufficient. Only the callers of this door are accepted, by the DNS name in
; their leaf's SANs (stunnel accepts the peer if ANY checkHost matches): the
; controller's gateway leaf (`gateway`), the worker, trellion, trellion-intel
; and evolve service leaves. The controller's OWN host node-agent dials
; this door with its node leaf, whose only distinguishing SAN is this
; controller's node id; a static conf cannot know it, so compose's
; `stunnel-self-pin` entrypoint appends `checkHost = $NODE_ID` at start and
; refuses to start without one. A grafana, backend or any other node's leaf
; chains to the same CA and is refused at the handshake.
checkHost = gateway
checkHost = worker
checkHost = trellion
checkHost = trellion-intel
checkHost = evolve
