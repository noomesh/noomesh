# Model-weight store — controller-hosted static file serving.
#
# Placement stays controller-driven (desired-state / pai_suggest_placement);
# this is the DELIVERY layer: the controller serves the weights it ALREADY
# downloaded, and a placed node copies them from here (LAN/Tailscale) instead
# of re-downloading from HuggingFace. No HF proxying, no CDN — just files the
# controller has on disk. The served tree lives in ONE include,
# docker/model-cache.locations.conf, so every listener below serves exactly
# the same paths.
#
# The controller populates the store simply by running/using models itself
# (its vLLM/TEI/Ollama fill HF_CACHE_DIR) or via `pai models pull`.
#
# ── Listeners ─────────────────────────────────────────
#
#   8443  mTLS, the data plane. The `model-cache` service leaf (issued by
#         `noo onboard`, SANs: noo-controller, the LAN IP, the tailnet name)
#         and `ssl_verify_client on` against the cluster CA. A CA-signed
#         leaf is necessary, not sufficient: the $mc_peer_ok map admits only
#         O="Mesh Cluster Node" (a node agent) and O="Mesh Cluster Gateway"
#         (the controller's own processes). A service leaf — prometheus,
#         grafana, loki — has no business with weights, so it is
#         refused with 403 after the handshake (96a principle: a leaf says
#         WHO, the org says WHAT it may do).
#
#   8083  GONE (phase 2, 2026-09-29). The plaintext listener that phase 1
#         kept for one release so an agent older than the TLS-capable
#         client could keep preseeding and pull its own upgrade over /bin/
#         is deleted: no server block, no port mapping. An agent that still
#         carries `http://<controller>:8083` in its env REFUSES to preseed
#         (preseed.CacheURL, refusal scope `model_cache_url`) and is named
#         by the `noo cluster verify` "model cache" row; the remedy is
#         `noo cluster provision <node>`, which renders the https URL.
#         Do not add a plain listener back: tests/test_model_cache_mtls_only.py
#         and the verify row both FAIL on `listen 8083`.
#
#   8084  loopback only, /healthz only, never published. The compose
#         healthcheck wgets it; the data-plane listeners answer no probe.
#
# What a peer without a cluster-CA node/gateway leaf gets: nothing — the
# handshake fails (no leaf) or the org filter answers 403 (a service
# leaf). Integrity does NOT rest on this channel either way — /images/ and
# /bin/ are digest-verified against the gateway's artifact manifest, fetched
# over mTLS (docker/backends.go fetchArtifactManifest), and the binary
# carries a signed JWS manifest that hostd re-hashes before any swap. Gated
# weights the controller pulled with HF_TOKEN are readable only by a node.

# $server_port stays in the log format: a request on any port other than
# 8443 is a listener that should not exist.
log_format model_cache '$remote_addr - [$time_local] :$server_port "$request" '
                       '$status $body_bytes_sent "$ssl_client_s_dn"';

# Nodes and the controller only. $ssl_client_s_dn is RFC 2253
# ("CN=host3,O=Mesh Cluster Node"); the org is matched as a whole
# component so "Mesh Cluster Node" cannot be satisfied by a longer name.
map $ssl_client_s_dn $mc_peer_ok {
    "~(^|,)O=Mesh Cluster Node(,|$)"     1;
    "~(^|,)O=Mesh Cluster Gateway(,|$)"  1;
    default                              0;
}

# ── The data plane: mTLS ──────────────────────────────────────────────────
server {
    listen 8443 ssl;
    server_name _;
    access_log /var/log/nginx/access.log model_cache;

    ssl_certificate         /tls/services/model-cache/service.crt;
    ssl_certificate_key     /tls/services/model-cache/service.key;
    ssl_client_certificate  /tls/ca.crt;
    ssl_verify_client       on;
    ssl_verify_depth        1;
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_session_tickets     off;

    # Handshake passed (a cluster-CA leaf); now the org. A server-level
    # `if` with a bare `return` is the one shape of `if` nginx documents
    # as safe.
    if ($mc_peer_ok = 0) {
        return 403;
    }

    include /etc/nginx/model-cache.locations.conf;
}

# ── Liveness, loopback only, never published ──────────────────────────────
server {
    listen 127.0.0.1:8084;
    server_name _;
    access_log off;
    server_tokens off;

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 404;
    }
}
