; stunnel mTLS proxy for the standalone profile's ollama-embed (Ollama has
; no TLS listener). Accepts mTLS on :11434, forwards plain HTTP to
; 127.0.0.1:11434 (the backend shares this container's network namespace
; and listens on loopback only: this door is the only way in). verify = 2:
; a caller without a cluster-CA client certificate is refused at the
; handshake.

foreground = yes
pid =

[ollama-embed]
accept = noo-stunnel-ollama-embed:11434
connect = 127.0.0.1:11434
cert = /tls/services/ollama-embed/service.crt
key = /tls/services/ollama-embed/service.key
CAfile = /tls/ca.crt
verify = 2
; Peer pinning (i132): a certificate from the cluster CA is necessary, not
; sufficient. Only the callers of this door are accepted, by the DNS name in
; their leaf's SANs (stunnel accepts the peer if ANY checkHost matches): the
; controller's gateway leaf (`gateway`), the worker, trellion, trellion-intel
; and evolve service leaves and the door's own leaf (`ollama-embed`, so its healthcheck,
; which dials the door from inside with that leaf, keeps working). The controller's OWN host node-agent dials
; this door with its node leaf, whose only distinguishing SAN is this
; controller's node id; a static conf cannot know it, so compose's
; `stunnel-self-pin` entrypoint appends `checkHost = $NODE_ID` at start and
; refuses to start without one. A grafana, backend or any other node's leaf
; chains to the same CA and is refused at the handshake.
checkHost = gateway
checkHost = worker
checkHost = trellion
checkHost = trellion-intel
checkHost = evolve
checkHost = ollama-embed
