; stunnel mTLS proxy for the standalone profile's ollama-embed (Ollama has
; no TLS listener). Accepts mTLS on :11434, forwards plain HTTP to
; ollama-embed:11434 on the compose network. verify = 2: a caller without
; a cluster-CA client certificate is refused at the handshake.

foreground = yes
pid =

[ollama-embed]
accept = 0.0.0.0:11434
connect = ollama-embed:11434
cert = /tls/services/ollama-embed/service.crt
key = /tls/services/ollama-embed/service.key
CAfile = /tls/ca.crt
verify = 2
