; stunnel mTLS proxy for TEI GPU (Text Embeddings Inference)
; Accepts mTLS on :443, forwards plain HTTP to tei-gpu:80

foreground = yes
pid =

[tei-gpu]
accept = 0.0.0.0:443
connect = tei-gpu:80
cert = /tls/services/tei/service.crt
key = /tls/services/tei/service.key
CAfile = /tls/ca.crt
verify = 2
