; stunnel mTLS proxy for TEI GPU (Text Embeddings Inference)
; Accepts mTLS on :443, forwards plain HTTP to tei-gpu:80

foreground = yes
pid =

[tei-gpu]
accept = 0.0.0.0:443
connect = tei-gpu:80
cert = /tls/services/tei/service.crt
key = /tls/services/tei/service.key
CAfile = /tls/ca.crt
verify = 2
; Peer pinning: a certificate from the cluster CA is necessary, not
; sufficient. Only the containers that call this door are accepted, by the
; DNS name in their leaf's SANs (stunnel accepts the peer if ANY checkHost
; matches): the controller's gateway leaf (`gateway`), the worker, trellion,
; trellion-intel and evolve service leaves. A grafana, node or backend leaf
; chains to the same CA and is refused at the handshake. The sibling doors
; that the controller's own HOST node-agent also dials with its node leaf
; (ollama, ollama-embed*, llamacpp) cannot be pinned by name: stunnel cannot
; match the O= the model-cache door filters on.
checkHost = gateway
checkHost = worker
checkHost = trellion
checkHost = trellion-intel
checkHost = evolve
