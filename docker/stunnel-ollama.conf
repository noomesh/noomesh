; stunnel mTLS proxy for Ollama
; Accepts mTLS on :11434, forwards plain HTTP to ollama:11434

foreground = yes
pid =

[ollama]
accept = 0.0.0.0:11434
connect = ollama:11434
cert = /tls/services/ollama/service.crt
key = /tls/services/ollama/service.key
CAfile = /tls/ca.crt
verify = 2
