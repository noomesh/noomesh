# Model-weight store — the served tree, shared by every listener.
#
# Included from the data-plane `server {}` block in
# docker/model-cache.nginx.conf (the mTLS listener, 8443 — the only one
# since phase 2 of an earlier change). Kept as a separate include so a
# location added to a server block instead of here is a review finding, and
# so any future listener serves exactly this tree. Mounted at
# /etc/nginx/model-cache.locations.conf — deliberately OUTSIDE conf.d/, whose
# `*.conf` glob would load this file as a top-level config and refuse to
# start on a bare `location`.
#
# Served trees:
#   /hf/<models--org--name>/...  → the controller's HF cache (HF_CACHE_DIR/hub)
#                                   JSON autoindex so a node's preseed walks
#                                   a model's files into its own HF cache.
#   /gguf/<file>                 → the controller's MODELS_DIR (llama.cpp,
#                                   ollama import, PullModelArtifact)
#   /images/<file>               → docker-save tars exported by
#                                   `noo cluster sync-images` (IMAGES_DIR);
#                                   nodes pull these digest-verified via the
#                                   gateway's artifact manifest (prop 22 §2)
#
# What it must never serve is a credential. HF_TOKEN is an env var, not a
# file here, and huggingface_hub writes `token`/`stored_tokens` at the
# HF_HOME ROOT — /hf-store/token — one level ABOVE the /hf-store/hub/ alias
# below. That is a property of one `alias` line, so it is asserted rather
# than assumed: the deny block fails the request even if someone widens the
# alias to /hf-store/, and tests/test_model_cache_serves_no_credentials.py
# fails the build if they do.

sendfile on;

# OFF by default (§3f R28). It used to be on server-wide, so /gguf/,
# /images/ and /bin/ each answered a full HTML index of the controller's
# model, image and binary stores to anyone who could reach the port —
# an inventory nobody needs, because every one of those three is fetched
# by EXACT filename from the gateway's artifact manifest, never by
# walking a listing. Only /hf/ re-enables it, and only as JSON, because
# preseed.Mirror genuinely recurses that tree (preseed.go list()).
autoindex off;

disable_symlinks off;        # HF cache links snapshots/→blobs/; serve targets
server_tokens off;

# Credential names, denied everywhere, whatever the alias says.
# huggingface_hub writes these at the HF_HOME root; the /hf/ alias is
# scoped to hub/ so they are out of reach today. This is the guard that
# keeps that true after the next edit to an alias line.
location ~ /(token|stored_tokens)$ {
    return 404;
}

# HuggingFace cache tree (repos are stored as models--org--name/).
# JSON listings — the node-agent's Go preseed fetcher walks them.
#
# HF_CACHE_DIR is an HF_HOME — the directory that CONTAINS hub/ — and is
# mounted here at /hf-store, so the served tree is /hf-store/hub/. Point
# HF_CACHE_DIR at a bare hub archive instead (models--* at the top level,
# no hub/) and there is nothing to alias: this answers 404, every node's
# preseed fails its listing fetch, the backends find no models, and not
# one of those messages says "wrong layout". An operator hit exactly that.
#
# The exact-match block below exists to say it. `/hf/` 404s only when
# /hf-store/hub/ is absent — an empty hub is a 200 with `[]` — so a 404
# on precisely this path IS the layout error, and nothing else is. Sub-
# paths keep the plain 404 they should have: a missing model is not a
# misconfigured mount.
#
# The status stays 404 deliberately. preseed.Client treats any non-200 as
# an error (preseed.go list()), which is right; a 200 carrying an error
# body would be read as an empty model list and look like success.
location = /hf/ {
    alias /hf-store/hub/;
    autoindex on;
    autoindex_format json;
    error_page 404 = @hf_layout;
}

location @hf_layout {
    default_type text/plain;
    # The path is spelled out rather than taken from $document_root:
    # nginx loses the alias across the error_page jump and reports the
    # default root (/etc/nginx/html), which names the wrong directory in
    # the one message whose whole job is naming the right one. /hf-store
    # is a fixed mount point, so a literal is also simply true.
    #
    # No other `$NAME` in this string: nginx expands every one as a
    # variable and refuses to start on an unknown name
    # ("unknown \"hf_cache_dir\" variable").
    return 404 "model-cache: /hf-store/hub does not exist.\n\nHF_CACHE_DIR must be an HF_HOME - the directory that CONTAINS hub/ - not a\nbare hub archive. Expected layout:\n\n  <HF_CACHE_DIR>/\n    hub/\n      models--<org>--<name>/\n\nFix: mkdir -p <hf-home>/hub && mv <archive>/models--* <hf-home>/hub/\nthen point HF_CACHE_DIR at <hf-home> and restart the stack.\nSee docs/models/weight-cache.md\n";
}

location /hf/ {
    alias /hf-store/hub/;
    autoindex on;            # the ONE tree a client walks
    autoindex_format json;
}

# GGUF weights for llama.cpp nodes, the ollama import and the `gguf`
# artifact pull. Fetched by exact filename, so no listing. There is NO
# /models/ location: MODELS_DIR is served here and only here (fu 1234 D).
location /gguf/ {
    alias /models/;
}

# Docker image tars for the agent /pull verb. The `.imageid` sidecars
# and `.exporting` temp files are export bookkeeping, not artifacts —
# nodes never request them, so no need to hide them.
location /images/ {
    alias /images-store/;
}

# No /bin/ location: the agent-binary store served the gateway-signed swap
# (`/pull kind=binary`), retired by an earlier change A3. Agent binaries reach a
# node only inside a signed provision bundle over the pull rail.
