# docker-compose.dist.yml — DISTRIBUTION overlay (run the published images).
#
# The base docker-compose.cluster.yml is a DEV file: every first-party service
# carries `pull_policy: build`, so `docker compose up` always compiles from the
# local source tree. That is the right default for development — but it means the
# published GHCR images are never actually exercised.
#
# This overlay flips the stack to pull-only. Layered on top of the base file it:
#   1. replaces `pull_policy: build` with `missing` (pull the image; never build)
#   2. repoints the images that hardcode `noomesh/...` at
#      ${NOO_IMAGE_PREFIX}/...:${NOO_IMAGE_TAG} so they resolve to GHCR
#
# It deliberately does NOT strip the `build:` blocks. Compose needs them to stay
# schema-valid, and with pull_policy=missing they are inert — nothing builds.
#
# ALWAYS use it as an OVERLAY, never alone:
#
#   NOO_IMAGE_PREFIX=ghcr.io/noomesh NOO_IMAGE_TAG=v0.1.8 \
#     docker compose -f docker-compose.cluster.yml -f docker-compose.dist.yml \
#     --profile controller up -d
#
# In practice you never type that — use the CLI, which sets the vars, verifies
# the GHCR login and pulls first:
#
#   noo stack start --dist              # newest pinned release
#   noo stack start --dist --tag v0.1.7 # a specific one
#   noo stack reset --dist              # wipe + onboard + stand up from images
#
# The core images are public: no registry login is needed. Add-on images are in
# a private registry and need `docker login ghcr.io` once registry access is
# granted with the entitlement.
#
# `NOO_INSTALL_MODE` (recorded by `noo onboard`) decides which way a bare
# `noo stack start` goes: on a dist install it behaves like `--dist`. To
# force a one-off source run on any install, use `noo stack start --dev`
# (mutually exclusive with `--dist`/`--build`).

services:
  # ── Published to GHCR by .github/workflows/images-release.yml ────────────
  # These already interpolate ${NOO_IMAGE_PREFIX}/${NOO_IMAGE_TAG} in the base
  # file, so only the pull policy needs flipping.
  deps-core:
    pull_policy: missing

  deps-base:
    pull_policy: missing

  gateway:
    pull_policy: missing

  node-agent:
    pull_policy: missing

  # trellion is NOT here either: its overlay interpolates
  # `pull_policy: ${NOO_PULL_POLICY:-build}` and lib-dist exports
  # NOO_PULL_POLICY=missing in dist mode.

  # trellion-intel / noo-evolve are NOT here: they are licensed add-on
  # overlays with their own `pull_policy: missing`, and a dist row for a
  # service the overlay did not compose would define a bare service with no
  # image. Their image is NOO_ADDON_IMAGE_<NAME>, the digest ref the add-on's
  # own signed lock pins (scripts/lib-dist.sh require_addon_pins); the stack
  # release publishes no add-on image and the launcher never pulls one.

  # whisper / piper are NOT here: the voice add-on is an
  # overlay, the launcher's --no-build makes a dist install pull them, and a
  # dist row for a service the overlay did not compose is a bare service
  # compose refuses. Their images must still be published: pinned by
  # tests/test_dist_mode.py::test_every_addon_overlay_image_is_published.

  # ── Images whose base-file ref is hardcoded to the local dev name ────────
  # Repointed at the registry as well as flipped to pull-only.
  sandbox:
    image: ${NOO_IMAGE_PREFIX:?set by scripts/lib-dist.sh — run `noo stack start --dist`, not docker compose}/sandbox:${NOO_IMAGE_TAG:-latest}${NOO_IMAGE_DIGEST_SANDBOX:-}
    pull_policy: missing
  sandbox-extra:
    image: ${NOO_IMAGE_PREFIX:?set by scripts/lib-dist.sh — run `noo stack start --dist`, not docker compose}/sandbox:${NOO_IMAGE_TAG:-latest}${NOO_IMAGE_DIGEST_SANDBOX:-}
    pull_policy: missing

  worker:
    image: ${NOO_IMAGE_PREFIX:?set by scripts/lib-dist.sh — run `noo stack start --dist`, not docker compose}/worker:${NOO_IMAGE_TAG:-latest}${NOO_IMAGE_DIGEST_WORKER:-}
    pull_policy: missing

  # Image name differs from the service name (see the release matrix).
  postgres:
    image: ${NOO_IMAGE_PREFIX:?set by scripts/lib-dist.sh — run `noo stack start --dist`, not docker compose}/postgres-pgvector:${NOO_IMAGE_TAG:-latest}${NOO_IMAGE_DIGEST_POSTGRES_PGVECTOR:-}
    pull_policy: missing

  nvidia-exporter:
    image: ${NOO_IMAGE_PREFIX:?set by scripts/lib-dist.sh — run `noo stack start --dist`, not docker compose}/nvidia-exporter:${NOO_IMAGE_TAG:-latest}${NOO_IMAGE_DIGEST_NVIDIA_EXPORTER:-}
    pull_policy: missing

  # llamacpp is in the release matrix and the lock; pull it like the core
  # (the base service still carries a build: block for dev checkouts).
  llamacpp:
    pull_policy: missing

  # The standalone profile's embedder sidecar (stunnel-ollama-embed, the
  # mTLS door in front of ollama-embed) runs on EVERY standalone install,
  # so its image is in the release matrix (`stunnel`, docker/Dockerfile.stunnel)
  # and pulled here. EVERY stunnel-* door is overridden the same way (below):
  # a dist install ships no Dockerfile.stunnel, and an engine in
  # `network_mode: service:<door>` (vllm, vllm-secondary, llamacpp, ...) cannot
  # start without its door. tests/test_dist_mode.py enforces it.
  stunnel-ollama-embed:
    image: ${NOO_IMAGE_PREFIX:?set by scripts/lib-dist.sh — run `noo stack start --dist`, not docker compose}/stunnel:${NOO_IMAGE_TAG:-latest}${NOO_IMAGE_DIGEST_STUNNEL:-}
    pull_policy: missing

  # The optional CPU embedder's door (profile `embed-cpu`): the same
  # published stunnel image as above.
  stunnel-ollama-embed-cpu:
    image: ${NOO_IMAGE_PREFIX:?set by scripts/lib-dist.sh — run `noo stack start --dist`, not docker compose}/stunnel:${NOO_IMAGE_TAG:-latest}${NOO_IMAGE_DIGEST_STUNNEL:-}
    pull_policy: missing

  # Inference-node doors (same published stunnel image). The entrypoint is NOT
  # overridden: the compose self-pin wrapper (NOO_STUNNEL_SELF_NODE) must stay.
  stunnel-vllm:
    image: ${NOO_IMAGE_PREFIX:?set by scripts/lib-dist.sh — run `noo stack start --dist`, not docker compose}/stunnel:${NOO_IMAGE_TAG:-latest}${NOO_IMAGE_DIGEST_STUNNEL:-}
    pull_policy: missing

  stunnel-vllm-secondary:
    image: ${NOO_IMAGE_PREFIX:?set by scripts/lib-dist.sh — run `noo stack start --dist`, not docker compose}/stunnel:${NOO_IMAGE_TAG:-latest}${NOO_IMAGE_DIGEST_STUNNEL:-}
    pull_policy: missing

  stunnel-llamacpp:
    image: ${NOO_IMAGE_PREFIX:?set by scripts/lib-dist.sh — run `noo stack start --dist`, not docker compose}/stunnel:${NOO_IMAGE_TAG:-latest}${NOO_IMAGE_DIGEST_STUNNEL:-}
    pull_policy: missing

  stunnel-ollama:
    image: ${NOO_IMAGE_PREFIX:?set by scripts/lib-dist.sh — run `noo stack start --dist`, not docker compose}/stunnel:${NOO_IMAGE_TAG:-latest}${NOO_IMAGE_DIGEST_STUNNEL:-}
    pull_policy: missing

  stunnel-tei:
    image: ${NOO_IMAGE_PREFIX:?set by scripts/lib-dist.sh — run `noo stack start --dist`, not docker compose}/stunnel:${NOO_IMAGE_TAG:-latest}${NOO_IMAGE_DIGEST_STUNNEL:-}
    pull_policy: missing

  stunnel-tei-gpu:
    image: ${NOO_IMAGE_PREFIX:?set by scripts/lib-dist.sh — run `noo stack start --dist`, not docker compose}/stunnel:${NOO_IMAGE_TAG:-latest}${NOO_IMAGE_DIGEST_STUNNEL:-}
    pull_policy: missing

  stunnel-reranker:
    image: ${NOO_IMAGE_PREFIX:?set by scripts/lib-dist.sh — run `noo stack start --dist`, not docker compose}/stunnel:${NOO_IMAGE_TAG:-latest}${NOO_IMAGE_DIGEST_STUNNEL:-}
    pull_policy: missing

# NOT overridden here — and why:
#   sandbox-base, airllm, browser
#     Not in the `controller` profile, so a controller dist run never starts
#     them. llamacpp/airllm are inference-node images built on the node that
#     runs them; adding them to the release matrix is the next step if you want
#     pull-only WORKER installs too. (stunnel-* doors are NOT in this list: they
#     are overridden above, because an engine sharing a door's network namespace
#     fails to start without its door, on a controller as much as a node.)
#   redis, nats, vllm, ollama, tei*, reranker, loki, tempo, prometheus,
#   alertmanager, grafana, node-exporter, model-cache
#     Third-party upstream images — already pulled, never built. Untouched.
