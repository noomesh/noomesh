[package]
name = "noo-gateway"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Mesh Gateway — Rust implementation"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["ws", "json", "multipart"] }
axum-extra = { version = "0.10", features = ["cookie"] }
rand = "0.10"
base64 = "0.23"
# Intelligent-tier entitlement verification (entitlement.rs). Already in the
# lock via nkeys, so this adds no new code to the trust boundary.
ed25519-dalek = "2"
# Agent-message sealing: X25519 key agreement +
# ChaCha20-Poly1305 AEAD. Pure Rust, same dalek family as the entitlement key.
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.11"
zeroize = "1"
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "add-extension", "catch-panic"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
# WebSocket CLIENT, default features only: the reserved-workload relay
# (routes/reservations.rs) and add-on WS routes (addon_ws.rs). The same
# tokio-tungstenite axum's `ws` feature pins; the TLS hop is tokio-rustls
# over the cluster's rustls config (tls.rs).
tokio-tungstenite = "0.29"
futures = "0.3"

# HTTP client (for LLM backends)
# default-features = false: reqwest's default TLS was native-tls (0.12), which
# links OpenSSL, so the gateway carried BOTH stacks and the builder needed
# libssl-dev, while every TLS decision in the tree (tls.rs, bus.rs, the
# rustls provider) is rustls. Found 2026-09-18 when the harness binary had
# to cross-compile for aarch64 and darwin: OpenSSL was the one C dependency
# with no cross story. Nothing used it.
# reqwest 0.13 renamed the TLS features: `rustls` = rustls + the aws-lc-rs
# provider (the one main.rs installs, and already in the tree via axum-server,
# fred and sqlx) + rustls-platform-verifier, which trusts the SYSTEM store.
# The old `rustls-tls` / `rustls-tls-native-roots` features are gone, and
# `query` and `form` are now features of their own.
# Both stores, as before (without the system store the DEFAULT client would
# trust only Mozilla's roots, where OpenSSL trusted the system store): the external MCP client dials whatever an operator
# registered, and a server behind a private CA installed in the system store
# must keep working. The system store comes from the platform verifier; the
# bundled Mozilla roots are merged in by tls::client_builder() through
# tls_certs_merge (webpki-root-certs below). Cluster calls pin the cluster CA
# through a preconfigured rustls config and trust ONLY it (tls.rs).
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "multipart", "query", "form", "rustls", "charset", "http2", "system-proxy"] }
# Mozilla roots as DER certificates, for reqwest's tls_certs_merge (reqwest 0.13
# ships no bundled roots). Same Mozilla set as webpki-roots, in the form reqwest takes.
webpki-root-certs = "1"

# NATS messaging + KV
# websockets is off because NATS is reached over tls:// only; it keeps
# tokio-websockets and webpki-roots 0.26 out of the tree. All other defaults kept.
async-nats = { version = "0.49", default-features = false, features = ["server_2_10", "server_2_11", "server_2_12", "server_2_14", "service", "ring", "jetstream", "nkeys", "crypto", "object-store", "kv", "nuid"] }

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "json", "chrono", "uuid", "tls-rustls-ring"] }

# Redis
fred = { version = "10", features = ["i-all", "enable-rustls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto", "use_pem"] }
hmac = "0.13"
sha2 = "0.11"
bcrypt = "0.17"
# Google service-account OAuth2 (for chat.googleapis.com outbound).
# Handles SA JWT signing + token exchange + refresh caching.
yup-oauth2 = "12"

# Config
serde_yaml = "0.9"

# TLS
rustls = "0.23"
tokio-rustls = "0.26"
x509-parser = "0.18"
axum-server = { version = "0.8", features = ["tls-rustls"] }
rustls-pemfile = "2"
# Mozilla root bundle (TLS_SERVER_ROOTS) used as the fallback trust store in
# src/tls.rs. 1.x is required: < 1.0.10 trusts distrusted emSign roots
# (RUSTSEC-2026-0381).
webpki-roots = "1"
# X.509 parsing for the cert-expiry heartbeat actions. rustls-pemfile decodes
# PEM but exposes no certificate fields, so `notAfter` was unreachable — the
# reason those actions stayed in Python.
#
# This is not new capability in the trust boundary: rustls-webpki already
# parses and validates X.509 on every TLS handshake, and der/spki/const-oid
# are already in the tree. x509-cert (RustCrypto) builds on those exact
# crates, so it is closer to one addition than a new stack — deliberately
# chosen over x509-parser, which brings its own nom-based parser.
#
# PARSING ONLY. Nothing here mints or signs certificates: rotation runs on
# the host via the watcher spool (`pai security pki rotate-all`), which
# carries the backup → rotate → probe → auto-revert envelope. Do not reach
# for a signing crate here without moving that decision first.
x509-cert = { version = "0.2", default-features = false, features = ["pem"] }

# Birth-key proof of possession on the provisioning pull lane (birth_proof.rs).
# VERIFICATION ONLY — this crate never mints or holds an RSA
# private key; the birth key lives on the node and nowhere else.
#
# Not new code in the trust boundary: `rsa` 0.9 and its pkcs1/pkcs8/spki/
# signature dependencies were already resolved in Cargo.lock, and x509-cert
# above already parses the certificate. The algorithm is fixed by what the node
# can produce with the openssl every enrolled host already has:
# `openssl dgst -sha256 -sign` is RSA PKCS#1 v1.5 over SHA-256.
rsa = { version = "0.9", features = ["sha2"] }

# Regex (security input validation)
regex = "1"

# Utilities
hex = "0.4"
time = "0.3"  # axum-extra cookie expiry uses this crate's Duration
chrono = { version = "0.4", features = ["serde"] }
# Timezone-aware cron evaluation for the heartbeat scheduler.
# Default TZ is read from NOO_HEARTBEAT_TZ (default America/New_York).
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
# Cron expression parsing (heartbeat scheduler + autonomy intervals).
# Matches the Python `croniter` semantics used by `gateway/heartbeat.py`.
cron = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
anyhow = "1"
thiserror = "2"
urlencoding = "2"
# statvfs(2) for the disk_watermark autonomy evaluator. Already present as a
# transitive dep, so this adds no new crates to the build graph.
libc = "0.2"
serde_urlencoded = "0.7"
# Reads the operator's PEM signing key in `jwks.rs` (`KeyPair::from_pem`) —
# it validates the curve and hands back the uncompressed public point,
# which is exactly what the JWKS needs. Moved out of [dev-dependencies]
# for that: it was already compiled for the test profile and is already in
# Cargo.lock, so this adds nothing to the build graph. Still the only
# non-test use; certificate ISSUANCE lives in noo-cli, not here.
rcgen = "0.13"
flate2 = "1"

[dev-dependencies]

# The release binary is what nodes RUN as their harness, and
# it rides the provision bundle to every node on every restage. Unstripped
# it was 58.7 MB of an 85.4 MB bundle — 69% — while noo-cli, in this same
# repo, has stripped since it started shipping. The neighbour being tidy is
# what kept this invisible.
#
# Debug symbols buy a node nothing: a panic there is diagnosed from the
# journal (`noo cluster logs <node> harness`), not from a local backtrace
# nobody can reach, and the release lane keeps the unstripped artifact if
# anyone ever needs one.
[profile.release]
strip = true
