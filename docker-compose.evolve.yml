# docker-compose.evolve.yml — the evolve add-on from the PUBLISHED image.
#
# This is the overlay a DIST install uses: no checkout of the add-on's source on the
# box, no local build, the image pulled by digest from the release lock like
# every other first-party service. The dev overlay still lives in the
# add-on checkout (its own docker-compose.evolve.yml) and the
# launcher prefers it when a checkout is present, because that one bind-mounts
# source for live editing.
#
# Why this exists: `addons.evolve: true` used to require a checkout that the
# product never delivered. The gateway provisioned evolve's role and schema,
# /health reported the add-on enabled, its routes were mounted — and nothing
# served them, because the only overlay lived in another repository. The other
# add-on (trellion-intel) ships as a release image; this brings evolve to
# the same shape.
#
# Two things the dev overlay mounts that this one deliberately does NOT:
#   - the add-on's source package into the worker. The worker's import of it is
#     try/except guarded (mcp/tool_defs/__init__.py), so without the mount the
#     pro tool defs simply do not register. Followup: bake them into the image.
#   - mcp-tools-evolve.json into the gateway as NOO_MCP_EXTRA_MANIFEST. The
#     gateway skips an unset manifest (mcp_local.rs merge_extra_manifest), so
#     the evolve HTTP routes work and only the MCP tool FRAGMENT is absent.
#
# The route manifest. The gateway carries none of evolve's routes: the evolve
# image ships its manifest, and this overlay hands it to the gateway READ-ONLY
# at /opt/noo/addon-routes/evolve/routes.json. `noo-evolve-routes` below is a
# one-shot from the same image that writes it into the `evolve-routes`
# volume, and the gateway waits for it to finish before starting, so the
# manifest it reads is always the one in the image beside it (an upgrade
# rewrites it; no host copy goes stale). An evolve image from before the
# manifest shipped has none: the one-shot says so and exits 0 so the stack
# still starts, and the gateway refuses evolve's routes, naming the fix
# (/health `addons.evolve: unhealthy`). The add-on's own overlay delivers the
# same file at the same target, and the parity check holds both to it.
#
# The env block is an explicit allowlist, kept identical to the dev overlay's:
# the release workflow diffs the two and refuses to publish on drift.
#
# No `profiles:` in here, on purpose: composing this file IS
# the switch. A profile inside the overlay was a second switch, and a launcher
# that passed the file without it recreated everything except noo-evolve.
# ── What this add-on's gateway key asks for ──────────
# `x-noo-addon` is the ONE place this add-on's per-consumer key is declared.
# noo-cli's build script reads it from this file and derives the secret
# registry row (`noo security secrets` rotate/audit/doctor), the default
# grant `noo security service-key provision evolve` shows and asks the
# operator to confirm, and the `cluster verify` grants check. The overlay
# only ASKS: the operator grants at provision, or by enabling the add-on
# (`noo addons enable`, which shows the same request first), and the gateway
# decides what each word opens (`GET /api/security/service-keys/scopes`).
#
# Compose never reads an `x-` key, so this block has no runtime effect. It is
# read PER FILE and never from `docker compose config`: compose merges
# top-level `x-` keys across `-f` files, so the merged projection shows only
# the last overlay's block. tests/test_addon_declares_its_grant.py pins the
# block against this file's own NOO_GATEWAY_KEY interpolation, both ways.
#
# This DIST copy is the authority for the block (evolve ships pre-built like
# the other add-ons). The add-on's own dev overlay may carry the same block;
# if it does, the guard insists it is identical.
# The scopes below are every write its gateway client makes. Its `config:` rows are the sections its loop may
# tune plus its own switch; `tools`
# is left out because only an admin person may write it. `conversation_stats`
# is its one READ scope: fleet-wide aggregates from the three
# `/api/conversations/*stats` routes for the composite score, never a user's
# rows.
x-noo-addon:
  addon: evolve
  consumer: svc:evolve
  key: NOO_SVC_KEY_EVOLVE
  containers: [noo-evolve]
  scopes:
    - temporal
    - heartbeat
    - activities
    - channels:send
    - metrics
    - config:agent
    - config:memory
    - config:cluster
    - config:cache
    - config:web_search
    - config:self_identity
    - config:prompt_skills
    - config:recall_memory
    - config:ga
    - conversation_stats
    - prompt_skills:write
  why: >-
    the evolve loop writes temporal edges, runs and toggles
    heartbeat tasks, files activities, sends operator alerts, posts its
    counters, tunes these config sections and reads fleet-wide conversation
    stats aggregates (tool usage, totals, feedback ratios) for its composite
    score, and writes evolved prompt skills into the gateway's store.

# Evolve's own secrets (compose merges top-level `secrets:` across files). No
# shared secret: evolve's own key is its only gateway
# credential, and neither NOO_CONTROLLER_SECRET nor NOO_CLUSTER_SECRET is
# delivered to it. Sourced from the
# LAUNCHER's environment, never a host file: lib-secrets.sh
# derive_file_secrets exports every source (empty when the store lacks it)
# and derives NOO_PGPASS_EVOLVE.
secrets:
  noo_svc_key_evolve:
    environment: NOO_SVC_KEY_EVOLVE
  pgpass_evolve:
    environment: NOO_PGPASS_EVOLVE

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

volumes:
  # Holds evolve's route manifest; written only by noo-evolve-routes, mounted
  # read-only by the gateway.
  evolve-routes:

services:
  gateway:
    volumes:
      - evolve-routes:/opt/noo/addon-routes/evolve:ro
    depends_on:
      noo-evolve-routes:
        condition: service_completed_successfully

  # One-shot: copy the image's route manifest into evolve-routes, then exit.
  # No network, no secrets, no PKI: it reads a file from its own image.
  noo-evolve-routes:
    logging: *default-logging
    image: ${NOO_IMAGE_PREFIX:?set by scripts/lib-dist.sh — run `noo stack start --dist`, not docker compose}/evolve:${NOO_IMAGE_TAG:-latest}${NOO_IMAGE_DIGEST_EVOLVE:-}
    container_name: noo-evolve-routes
    network_mode: none
    restart: "no"
    volumes:
      - evolve-routes:/out
    entrypoint: ["sh", "-c"]
    command:
      - |
        rm -f /out/routes.json
        noo-evolve-routes-manifest /out/routes.json || echo "noo-evolve-routes: this evolve image ships no route manifest (it predates manifests shipping with the add-on); the gateway will refuse evolve's routes until the gateway and the evolve image come from the same release (noo stack start)" >&2

  noo-evolve:
    logging: *default-logging
    # Same override shape as the trellion-intel overlay: NOO_EVOLVE_IMAGE is the
    # whole reference (escape hatch), NOO_EVOLVE_IMAGE_PREFIX the namespace (the
    # add-ons are licensed and live in a private registry that is NOT the core
    # prefix), and NOO_IMAGE_PREFIX the fallback, which stays REQUIRED here so a
    # bare `docker compose` still fails loudly. NOO_IMAGE_DIGEST_EVOLVE pins by
    # digest when the lock (or the operator) supplies one; unset, the tag is used.
    # scripts/lib-dist.sh::require_addon_images says why when this cannot be pulled.
    image: ${NOO_EVOLVE_IMAGE:-${NOO_EVOLVE_IMAGE_PREFIX:-${NOO_IMAGE_PREFIX:?set by scripts/lib-dist.sh — run `noo stack start --dist`, not docker compose}}/evolve:${NOO_IMAGE_TAG:-latest}${NOO_IMAGE_DIGEST_EVOLVE:-}}
    container_name: noo-evolve
    # Every secret arrives as a FILE /run/secrets/<name>
    # from the `secrets:` list below, the environment holding only the
    # `<NAME>_FILE` pointer — `${NAME:+…}`, unset when the store lacks the
    # value. The reader is the add-on's own secret_env module, in
    # the image (x-noo-secrets-floor); it refuses to boot
    # on NAME and NAME_FILE both set. Owner uid 0: the image
    # (python:3.12-slim) sets no USER.
    #
    # NOTE this env allowlist's NAMES must equal the add-on's own overlay:
    # scripts/check-evolve-overlay-parity.sh fails the PR (ci.yml
    # `sibling-overlay-parity`, against the add-on repo at the PR base's branch)
    # and the release (images-release.yml evolve job). Land a new name in
    # the add-on repo first, then here.
    secrets:
      - { source: noo_svc_key_evolve, target: noo_gateway_key, uid: "0", gid: "0", mode: 0400 }
      - { source: pgpass_evolve, target: pgpass, uid: "0", gid: "0", mode: 0400 }
    environment:
      # Vendor telemetry off (docs/security/telemetry.md): huggingface_hub and
      # the libraries built on it honour these.
      - HF_HUB_DISABLE_TELEMETRY=1
      - DO_NOT_TRACK=1
      # No DSN carries a password: psycopg (libpq) reads PGPASSFILE — one
      # line each for noo_evolve and noo_evolve_ddl, libpq-escaped
      # (lib-secrets.sh NOO_PGPASS_ROLES_EVOLVE).
      - PGPASSFILE=${NOO_PGPASS_EVOLVE:+/run/secrets/pgpass}
      - NOO_EVOLVE_DATABASE_URL=postgresql://noo_evolve@postgres:5432/noomesh?options=-c%20search_path%3Devolve,public&sslmode=verify-full&sslrootcert=/tls/ca.crt&sslcert=/tls/services/evolve/service.crt&sslkey=/tls/services/evolve/service.key
      # No bare NOO_EVOLVE_DB_PASSWORD either: noo_evolve/config.py reads
      # only the DSN, and the password is in the pgpass file.
      - NOO_EVOLVE_DDL_DATABASE_URL=postgresql://noo_evolve_ddl@postgres:5432/noomesh?sslmode=verify-full&sslrootcert=/tls/ca.crt&sslcert=/tls/services/evolve/service.crt&sslkey=/tls/services/evolve/service.key
      - NOO_EVOLVE_HOST=0.0.0.0
      # The listener is HTTPS-only and requires a cluster-CA client
      # certificate: the gateway dials
      # https://noo-evolve:8090 (the base_url_default of evolve's own manifest)
      # presenting its own leaf, and this container answers with its
      # `services/evolve` leaf (SANs evolve, noo-evolve, localhost,
      # 127.0.0.1). Required: unset or unreadable, evolve refuses to start —
      # there is no plaintext listener. The image's HEALTHCHECK presents the
      # same leaf. Root in the container reads the mounted key directly;
      # only libpq needs the /tmp copy staged below.
      # tests/test_addon_doors_are_mtls.py pins these three.
      - NOO_EVOLVE_TLS_CERT=/tls/services/evolve/service.crt
      - NOO_EVOLVE_TLS_KEY=/tls/services/evolve/service.key
      - NOO_EVOLVE_TLS_CLIENT_CA=/tls/ca.crt
      - NOO_EVOLVE_GATEWAY_URL=${NOO_EVOLVE_GATEWAY_URL:-https://gateway:8080}
      # Evolve's own gateway key: exchanged at the add-on door
      # for a token carrying the control scopes `provision evolve` grants —
      # one per write it makes (temporal, heartbeat, activities,
      # channels:send, config:<section>).
      # It is evolve's ONLY gateway credential: the
      # cluster-HMAC fallback is retired from the client and refused by the gateway from
      # an add-on, so NOO_CONTROLLER_SECRET / NOO_CLUSTER_SECRET are not
      # delivered here. Absent, evolve refuses every gateway call in-process,
      # naming `noo security service-key provision evolve`.
      - NOO_GATEWAY_KEY_FILE=${NOO_SVC_KEY_EVOLVE:+/run/secrets/noo_gateway_key}
      # NOO_EVOLVE_TLS_VERIFY is retired:
      # verification is always on and evolve refuses an off value.
      - NOO_TLS_CA=${NOO_TLS_CA:+/tls/ca.crt}
      - NOO_EVOLVE_CONTROLLER_HOSTNAME=${NODE_ID:-controller}
      # On by default: enabling the evolve add-on means its
      # learning loop runs. `noo loop disable` / NOO_EVOLVE_HOFSTADTER_ENABLED=0
      # turns it off; `noo ga rollback` undoes what it applied.
      - NOO_EVOLVE_HOFSTADTER_ENABLED=${NOO_EVOLVE_HOFSTADTER_ENABLED:-1}
      - NOO_EVOLVE_GA_ENABLED=${NOO_EVOLVE_GA_ENABLED:-1}
      - NOO_EVOLVE_RL_ENABLED=${NOO_EVOLVE_RL_ENABLED:-1}
      - NOO_EVOLVE_RECONCILE_SECS=${NOO_EVOLVE_RECONCILE_SECS:-30}
      - NOO_AGENT_AUTORETRY=${NOO_AGENT_AUTORETRY:-0}
      - NOO_AGENT_ESCALATE_NOTIFY=${NOO_AGENT_ESCALATE_NOTIFY:-0}
      - NOO_AGENT_AUTODISABLE=${NOO_AGENT_AUTODISABLE:-0}
      - NOO_AGENT_ACTIVITY_PROPOSE=${NOO_AGENT_ACTIVITY_PROPOSE:-0}
      - NOO_AGENT_ACTIVITY_AUTOCREATE=${NOO_AGENT_ACTIVITY_AUTOCREATE:-0}
      - NOO_AGENT_ACTIVITY_PURSUE=${NOO_AGENT_ACTIVITY_PURSUE:-0}
      - NOO_AGENT_ACTIVITY_AUTOCOMPLETE=${NOO_AGENT_ACTIVITY_AUTOCOMPLETE:-0}
      - NOO_AGENT_ALERT_CHANNEL=${NOO_AGENT_ALERT_CHANNEL:-google_chat}
      - NOO_AGENT_ALERT_RECIPIENT=${NOO_AGENT_ALERT_RECIPIENT:-broadcast}
    volumes:
      # The CA (to verify the gateway and Postgres) plus evolve's OWN leaf,
      # `services/evolve` — the client certificate Postgres requires from
      # every TCP client. Its own, not the controller's
      # `gateway/` leaf: that leaf means "this caller may command a node
      # agent", and an add-on has no business holding it (see
      # tests/test_pki_mounts_are_narrow.py). Issued by `noo onboard`
      # (SVC_LIST) or `noo security pki issue-service evolve`.
      - ${NOO_PKI_DIR:-./.pki-placeholder}/ca.crt:/tls/ca.crt:ro
      - ${NOO_PKI_DIR:-./.pki-placeholder}/services/evolve:/tls/services/evolve:ro
    # libpq refuses a private key that is group/world-readable, and the
    # fleet's leaf keys are 0644 on purpose (noo-cli/src/pki.rs). The
    # controller's Python processes stage a 0600 copy under /tmp/pki
    # themselves (docker/entrypoint.py); evolve's image is a plain
    # python:3.12-slim with no entrypoint of its own, so the staging lives
    # here: copy the key, then point every DSN's `sslkey=` at the copy.
    # The DSNs above keep naming the MOUNT path, which is the one thing
    # the guard test can see; the rewrite is the same `/tls → /tmp/pki`
    # rule the gateway's stage_pki applies to `/app/pki`.
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ -f /tls/services/evolve/service.key ]; then
          umask 077
          mkdir -p /tmp/pki/services/evolve
          cp /tls/services/evolve/service.key /tmp/pki/services/evolve/service.key
          chmod 600 /tmp/pki/services/evolve/service.key
          NOO_EVOLVE_DATABASE_URL="$$(printf '%s' "$$NOO_EVOLVE_DATABASE_URL" | sed 's#sslkey=/tls/#sslkey=/tmp/pki/#')"
          NOO_EVOLVE_DDL_DATABASE_URL="$$(printf '%s' "$$NOO_EVOLVE_DDL_DATABASE_URL" | sed 's#sslkey=/tls/#sslkey=/tmp/pki/#')"
          export NOO_EVOLVE_DATABASE_URL NOO_EVOLVE_DDL_DATABASE_URL
        else
          echo "noo-evolve: no client certificate at /tls/services/evolve/service.key — Postgres will refuse this container and evolve will not serve its HTTPS listener (noo security pki issue-service evolve, then noo stack restart --force)" >&2
        fi
        exec python -m noo_evolve
    networks:
      - noo-cluster
      - noo-db
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
        required: false
      gateway:
        condition: service_started
        required: false
